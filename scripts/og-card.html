<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spielkunst - social card</title>
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    font-weight: 600 800;
    src: url('public/fonts/bricolage-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Outfit';
    font-weight: 300 700;
    src: url('public/fonts/outfit-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono';
    font-weight: 400 600;
    src: url('public/fonts/geist-mono-latin.woff2') format('woff2');
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 64px 48px;
    background:
      radial-gradient(760px 420px at 88% -14%, rgba(201, 249, 75, 0.18), transparent 66%),
      radial-gradient(620px 380px at 4% 108%, rgba(255, 196, 107, 0.10), transparent 66%),
      #08090a;
    color: #f6f3eb;
    font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
  }

  /* hairline dot field, faded at the edges — the only texture */
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(680px 420px at 22% 46%, #000 10%, transparent 78%);
    -webkit-mask-image: radial-gradient(680px 420px at 22% 46%, #000 10%, transparent 78%);
  }

  .top {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mark {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    background: #c9f94b;
    display: grid;
    place-items: center;
  }
  .mark svg { width: 30px; height: 30px; }
  .brand {
    font-family: 'Bricolage Grotesque', 'Outfit', sans-serif;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.045em;
    color: #f6f3eb;
  }
  .brand b { color: #c9f94b; font-weight: 800; }
  .pill {
    margin-left: auto;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c9f94b;
    border: 1px solid rgba(201, 249, 75, 0.35);
    background: rgba(201, 249, 75, 0.10);
    padding: 8px 16px;
    border-radius: 999px;
  }

  .mid {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    align-items: center;
    gap: 40px;
  }

  h1 {
    font-family: 'Bricolage Grotesque', 'Outfit', sans-serif;
    font-size: 82px;
    line-height: 0.94;
    font-weight: 700;
    letter-spacing: -0.045em;
    max-width: 15ch;
  }
  h1 em { font-style: normal; color: #c9f94b; }

  p.lede {
    margin-top: 22px;
    max-width: 30ch;
    font-size: 23px;
    line-height: 1.45;
    font-weight: 400;
    color: #b6b2a8;
  }

  /* four game tiles, the same icon language the site uses */
  .tiles {
    display: grid;
    grid-template-columns: repeat(2, 128px);
    gap: 14px;
    justify-content: end;
  }
  .tile {
    width: 128px;
    height: 128px;
    border-radius: 30px;
    display: grid;
    place-items: center;
    background: linear-gradient(155deg, var(--a), var(--b));
    box-shadow: 0 22px 50px -22px rgba(0, 0, 0, 0.9);
    position: relative;
    overflow: hidden;
  }
  .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.22), transparent 52%);
  }
  .tile svg { width: 62px; height: 62px; position: relative; z-index: 1; }

  .foot {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a867d;
  }
  .foot b { color: #f6f3eb; font-weight: 500; }
  .foot i { font-style: normal; color: #c9f94b; }
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="top">
    <div class="mark">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="9.4" stroke="#0b1000" stroke-width="3"/>
        <path d="M13.6 11.4 21 16l-7.4 4.6Z" fill="#0b1000"/>
      </svg>
    </div>
    <div class="brand">spiel<b>kunst</b></div>
    <div class="pill">{{GAME_COUNT}} free games</div>
  </div>

  <div class="mid">
    <div>
      <h1>Free browser games that <em>start instantly</em>.</h1>
      <p class="lede">Word games, puzzles and arcade classics. No download, no sign-up, no paywall.</p>
    </div>

    <div class="tiles">
      <div class="tile" style="--a:#ff7fb8;--b:#8e2352">
        <svg viewBox="0 0 96 96" fill="none">
          <rect x="8" y="8" width="80" height="80" rx="22" fill="#08090a" opacity="0.28"/>
          <g fill="#fff">
            <rect x="20" y="20" width="14" height="14" rx="3.5"/>
            <rect x="41" y="20" width="14" height="14" rx="3.5"/>
            <rect x="62" y="20" width="14" height="14" rx="3.5"/>
            <rect x="20" y="41" width="14" height="14" rx="3.5" opacity="0.72"/>
            <rect x="41" y="41" width="14" height="14" rx="3.5" opacity="0.5"/>
            <rect x="62" y="41" width="14" height="14" rx="3.5" opacity="0.34"/>
            <rect x="20" y="62" width="14" height="14" rx="3.5" opacity="0.34"/>
          </g>
        </svg>
      </div>
      <div class="tile" style="--a:#ffc46b;--b:#96551a">
        <svg viewBox="0 0 96 96" fill="none">
          <rect x="14" y="14" width="30" height="30" rx="9" fill="#08090a" opacity="0.36"/>
          <rect x="52" y="14" width="30" height="30" rx="9" fill="#08090a" opacity="0.16"/>
          <rect x="14" y="52" width="30" height="30" rx="9" fill="#08090a" opacity="0.16"/>
          <rect x="52" y="52" width="30" height="30" rx="9" fill="#08090a" opacity="0.36"/>
        </svg>
      </div>
      <div class="tile" style="--a:#6fe3ff;--b:#126c8c">
        <svg viewBox="0 0 96 96" fill="none">
          <rect x="16" y="16" width="22" height="22" rx="7" fill="#08090a"/>
          <rect x="40" y="16" width="22" height="22" rx="7" fill="#08090a" opacity="0.66"/>
          <rect x="64" y="16" width="22" height="22" rx="7" fill="#08090a" opacity="0.4"/>
          <rect x="64" y="40" width="22" height="22" rx="7" fill="#08090a" opacity="0.28"/>
          <circle cx="34" cy="70" r="9" fill="#fff" opacity="0.9"/>
        </svg>
      </div>
      <div class="tile" style="--a:#c9f94b;--b:#5f9410">
        <svg viewBox="0 0 96 96" fill="none">
          <circle cx="48" cy="48" r="28" stroke="#08090a" stroke-width="9"/>
          <path d="M48 34v14l10 6" stroke="#08090a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="foot">
    <b>spielkunst.pages.dev</b>
    <i>◆</i>
    <span>one new grid every day</span>
    <i>◆</i>
    <span>plays offline</span>
  </div>
</body>
</html>
