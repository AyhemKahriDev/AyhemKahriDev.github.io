name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:10 UTC every day: refresh the rolling daily-puzzle window.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # npm 11 gates package install scripts; esbuild ships its binary as an
      # optional dependency, so --ignore-scripts is safe here.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
