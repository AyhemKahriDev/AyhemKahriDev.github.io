name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:10 UTC every day: refresh the rolling daily-puzzle window.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # npm 11 gates package install scripts; esbuild ships its binary as an
      # optional dependency, so --ignore-scripts is safe here.
      - run: npm ci --ignore-scripts
      # The audits and the smoke test drive a real browser, so they need one.
      - name: Install Chrome
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/hyperframes/chrome"
      - run: npm run typecheck
      - run: npm run build
      # The gate. A broken game, a dead link or a page that no longer parses
      # must never reach a deploy.
      - name: Audit
        run: npm run audit
      - name: Smoke test
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

  # The brand domain. Skipped automatically until an API token is added as a
  # repository secret, so the workflow never fails on a fresh clone.
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@latest pages deploy dist --project-name=arcadefork --branch=main
