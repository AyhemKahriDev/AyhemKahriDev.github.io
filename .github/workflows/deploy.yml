name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:10 UTC every day: refresh the rolling daily-puzzle window.
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: >-
          Publish without the smoke gate (hotfix only). Typecheck, tests, build,
          audit and theme contrast still run and are still fatal.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # One group per branch, so a push can never run beside another push: the
  # publish step force-pushes gh-pages and a second concurrent writer is how a
  # half-uploaded tree lands there.
  #
  # cancel-in-progress is what was missing. Without it a superseded push waits
  # for the run in front of it (each one now spends most of its life in the
  # browser gates), and the queue grows faster than it drains.
  #
  # The daily schedule refreshes the puzzle window and is exempt: it neither
  # cancels a run in progress nor queues on top of one. Caveat, stated because
  # it is a real tradeoff and not an oversight: the flag is evaluated on the
  # *incoming* run only, so a push that arrives during a scheduled run still
  # cancels it. Keeping every publish serialised is worth more than protecting
  # a scheduled run from a push an operator just made; the next schedule is 24 h
  # away and the daily puzzle window is also written by any push.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 90 minutes, sized from measurement rather than guessed:
    #   smoke was measured at ~8 min at 168 games and scales ~linearly with the
    #   catalogue, so 480 s / 168 = ~2.9 s per game; at the 500-game target that
    #   is ~24 min. `audit:health` drives the same embed set through a browser,
    #   so budget ~10 min for it at 500. Fixed cost around those two (checkout,
    #   npm ci, Chrome download plus up to 3 retries, typecheck, unit tests,
    #   build, themes, artifact upload, push) is ~7 min. Total ~41 min at 500
    #   games; x2 headroom for a slow runner leaves 90.
    # 90 < the 360-minute default, so a hang fails in 1.5 h with its log
    # attached instead of burning the full 6 h.
    # A push no longer pays the whole smoke estimate: the step samples the
    # vendored games (SMOKE_SAMPLE, see the step) and the daily schedule runs
    # the full sweep. Both still fit this budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # npm 11 gates package install scripts; esbuild ships its binary as an
      # optional dependency, so --ignore-scripts is safe here.
      - run: npm ci --ignore-scripts
      # The audits and the smoke test drive a real browser, so they need one.
      # `@stable` resolves through a manifest on a third-party host, which
      # occasionally answers with something that is not JSON (rate limited, or
      # a proxy error page) and takes the whole deploy down before a single
      # gate has run. Retry, then fall back to a pinned build that bypasses the
      # lookup entirely.
      - name: Install Chrome
        run: |
          set -euo pipefail
          install() {
            npx --yes @puppeteer/browsers install "$1" --path "$HOME/.cache/hyperframes/chrome"
          }
          for attempt in 1 2 3; do
            if install chrome-headless-shell@stable; then exit 0; fi
            echo "install attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "channel lookup is down; installing a pinned build instead"
          install chrome-headless-shell@156.0.8078.47
      - run: npm run typecheck
      # The artefact before the tests that assert on it. tests/brand.test.js
      # checks the built wordmark, the manifest count and the OG title, and each
      # of those cases skips itself when dist/ is absent. Running `npm test`
      # before the build therefore did not test the brand at all - it skipped it,
      # which is how a broken wordmark could reach a run that reports green.
      # Build first: those three cases now read dist/ and assert.
      - run: npm run build
      # Unit tests are ~0.2 s and catch catalogue/copy regressions before the
      # browser gates, which cost minutes. Cheapest gate that can run goes first
      # - cheap is not a reason to run it before the input it needs exists.
      - name: Unit tests
        run: npm test
      # The gate. A broken game, a dead link or a page that no longer parses
      # must never reach a deploy.
      - name: Audit
        run: npm run audit
      # The same fatal gate as before, but teed to a log so a failure leaves
      # evidence, and the screenshots smoke already writes are captured too.
      # pipefail keeps `tee` from masking the exit status: a red run still
      # fails the step.
      - name: Smoke test
        id: smoke
        # Skips ONLY on a manual run with skip_smoke=true; on push/schedule the
        # input is absent (null), which is not true, so the gate runs.
        if: ${{ inputs.skip_smoke != true }}
        # Below the 90-minute job budget, so a hung browser fails the step and
        # still reaches the upload step below instead of being cancelled by the
        # job timeout.
        timeout-minutes: 45
        env:
          # The gate is not weakened, it is sized. Every structural page (home,
          # index, all nine categories, credits, advertise, daily, and each of
          # those per locale - 64 pages, read off dist/) and every first-party
          # game is still visited on every run; only the vendored games are
          # sampled, and the sample is deterministic, so a green push run and a
          # red one visit the same 80 pages.
          #
          # Measured, not guessed. Three timed local runs of this script against
          # the same build: 76 pages in 158 s, 108 in 215 s, 148 in 356 s (that
          # last one contains a single 90 s protocol-timeout waiver, so ~266 s
          # of real work) - about 2 s per page here. CI is ~1.35x slower: the old
          # step's own figure of ~8 min for 180 pages is 2.7 s/page against
          # ~2 s/page here. So 148 pages in CI is ~400 s, 6.7 min, and the full
          # sweep it replaces (623 pages) is ~28 min - which is what the push run
          # in progress is spending right now.
          #
          # The daily schedule omits it and takes that full sweep, so every
          # vendored game is still driven through a real browser once a day.
          SMOKE_SAMPLE: ${{ github.event_name == 'schedule' && 'all' || '80' }}
        run: |
          set -euo pipefail
          mkdir -p .smoke-report
          # Runs on every exit path, including a red `npm run smoke`. The log
          # is already streaming to .smoke-report via tee; this adds the shots.
          keep_shots() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              cp .smoke/*.png .smoke-report/ 2>/dev/null || true
            fi
            exit "$rc"
          }
          trap keep_shots EXIT
          npm run smoke 2>&1 | tee .smoke-report/smoke.log
      # always() so this runs when smoke failed or timed out. The job still
      # fails: no step uses continue-on-error.
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: .smoke-report
          if-no-files-found: ignore
          retention-days: 3
      - name: Note skipped smoke gate
        if: ${{ inputs.skip_smoke == true }}
        run: echo "::warning::smoke gate skipped by workflow_dispatch input skip_smoke=true"

      # Colour is a token tree here, so a theme can be checked without a
      # browser - and a theme nobody can read must never reach the menu.
      - name: Theme contrast
        run: npm run themes
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
      # Explicit success(): a red gate above must never publish.
      - name: Publish to gh-pages
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

  # The brand domain. Skipped automatically until an API token is added as a
  # repository secret, so the workflow never fails on a fresh clone.
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@latest pages deploy dist --project-name=spielkunst --branch=main
