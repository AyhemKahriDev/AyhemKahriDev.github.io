    /* ── Achievement Page Styles ─────────────────────────────────────────── */

    .ach-page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--space-lg);
    }

    /* ── Global Progress Bar ──────────────────────────────────────────── */

    .global-progress {
      margin-bottom: var(--space-2xl);
      text-align: center;
    }

    .global-progress .progress-label {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan-dim);
      letter-spacing: 0.08em;
      margin-bottom: var(--space-sm);
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--neon-cyan-dim);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan), var(--neon-green));
      box-shadow:
        0 0 10px var(--neon-cyan),
        0 0 20px var(--neon-cyan-dim),
        inset 0 0 6px rgba(255, 255, 255, 0.15);
      transition: width 1s ease;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.2) 50%,
        transparent 100%
      );
      animation: progress-shimmer 2s ease-in-out infinite;
    }

    @keyframes progress-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-percent {
      font-family: var(--font-score);
      font-size: 0.8rem;
      color: #aab;
      margin-top: var(--space-xs);
      letter-spacing: 0.1em;
    }

    /* ── Cross-Game Achievements ──────────────────────────────────────── */

    .cross-game-section {
      margin-bottom: var(--space-2xl);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--neon-magenta);
      text-shadow: 0 0 10px var(--neon-magenta-dim), 0 0 20px var(--neon-magenta-dim);
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--neon-magenta-dim);
    }

    .cross-game-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
    }

    /* ── Achievement Card ─────────────────────────────────────────────── */

    .ach-card {
      position: relative;
      background: var(--color-bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--card-radius);
      padding: var(--space-md);
      text-align: center;
      transition: all var(--transition-base);
      overflow: hidden;
    }

    .ach-card.locked {
      filter: grayscale(0.8) brightness(0.45);
      opacity: 0.7;
    }

    .ach-card.locked .ach-icon {
      filter: blur(1px);
    }

    .ach-card.locked::before {
      content: '\1F512';
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 0.75rem;
      opacity: 0.5;
    }

    .ach-card.unlocked {
      border-color: var(--neon-cyan-dim);
      box-shadow:
        0 0 8px var(--neon-cyan-dim),
        0 0 20px rgba(0, 255, 255, 0.08),
        inset 0 0 12px rgba(0, 255, 255, 0.04);
    }

    .ach-card.unlocked:hover {
      border-color: var(--neon-cyan);
      box-shadow:
        0 0 12px var(--neon-cyan-dim),
        0 0 30px rgba(0, 255, 255, 0.15),
        inset 0 0 16px rgba(0, 255, 255, 0.06);
      transform: translateY(-2px);
    }

    .ach-icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: var(--space-sm);
      transition: filter var(--transition-base);
    }

    .ach-name {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      color: #e0e0ff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .ach-desc {
      font-size: 0.7rem;
      color: #888;
      line-height: 1.4;
    }

    .ach-card.unlocked .ach-name {
      color: #fff;
      text-shadow: 0 0 6px var(--neon-cyan-dim);
    }

    .ach-card.unlocked .ach-desc {
      color: #aab;
    }

    /* ── Game Sections ────────────────────────────────────────────────── */

    .game-section {
      margin-bottom: var(--space-2xl);
    }

    .game-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--neon-cyan-dim);
    }

    .game-section-name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-cyan-dim);
    }

    .game-section-score {
      font-family: var(--font-score);
      font-size: 0.85rem;
      color: var(--neon-green);
      text-shadow: 0 0 4px var(--neon-green-dim);
      letter-spacing: 0.08em;
    }

    .game-ach-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--space-md);
    }

    /* ── Stats Footer ─────────────────────────────────────────────────── */

    .stats-footer {
      margin-top: var(--space-2xl);
      padding: var(--space-xl) var(--space-lg);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--neon-cyan-dim);
      border-radius: var(--card-radius);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-lg);
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan-dim);
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #888;
    }

    .stat-detail {
      font-family: var(--font-score);
      font-size: 0.7rem;
      color: var(--neon-green);
      text-shadow: 0 0 4px var(--neon-green-dim);
    }

    /* ── Responsive ───────────────────────────────────────────────────── */

    @media (max-width: 768px) {
      .cross-game-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .game-ach-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .stats-footer {
        grid-template-columns: 1fr;
        gap: var(--space-md);
      }
      .game-section-header {
        flex-direction: column;
        gap: var(--space-xs);
      }
    }

    @media (max-width: 480px) {
      .cross-game-grid {
        grid-template-columns: 1fr 1fr;
      }
      .game-ach-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .ach-icon {
        font-size: 1.6rem;
      }
      .ach-name {
        font-size: 0.7rem;
      }
      .section-title {
        font-size: 1rem;
      }
    }

    /* ── Page footer ──────────────────────────────────────────────────── */

    .site-footer {
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      color: #555;
      font-size: 0.75rem;
    }

    .site-footer a {
      color: #666;
    }
  </style>

    const CROSS_GAME_ACHIEVEMENTS = [
      { id: 'arcade-regular',  name: 'Arcade Regular', description: 'Play 5 different games',                  icon: '\uD83C\uDFAE' },
      { id: 'arcade-master',   name: 'Arcade Master',  description: 'Score 5000+ in 5 different games',        icon: '\uD83C\uDFC6' },
      { id: 'completionist',   name: 'Completionist',  description: 'Unlock all achievements in any single game', icon: '\uD83D\uDCAF' },
      { id: 'galaxy-champion', name: 'Galaxy Champion', description: 'Unlock all achievements across all games', icon: '\uD83D\uDE80' },
    ];

    const STORAGE_PREFIX = 'galaxy-arcade-achievements-';
    const GLOBAL_KEY = 'galaxy-arcade-global';

    // ── Helpers ──────────────────────────────────────────────────────────

    function loadJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch { return fallback; }
    }

    function getGameData(gameId) {
      return loadJSON(STORAGE_PREFIX + gameId, { unlockedIds: [], scores: {} });
    }

    function getGlobalData() {
      return loadJSON(GLOBAL_KEY, { gamesPlayed: [], crossGameUnlocked: [] });
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatNumber(n) {
      return n.toLocaleString();
    }

    // ── Build the page ───────────────────────────────────────────────────

    function buildPage() {
      const globalData = getGlobalData();
      const crossUnlocked = new Set(globalData.crossGameUnlocked || []);

      // Gather all per-game stats
      let totalUnlocked = 0;
      let totalAchievements = 0;
      let totalScore = 0;
      let favoriteGame = null;
      let favoriteScore = -1;
      const gameStats = {};

      for (const [gameId, gameDef] of Object.entries(ALL_GAME_ACHIEVEMENTS)) {
        const data = getGameData(gameId);
        const unlockedSet = new Set(data.unlockedIds);
        const highScore = data.scores.highest || 0;

        const achStatus = gameDef.achievements.map(a => ({
          ...a,
          unlocked: unlockedSet.has(a.id),
        }));

        const unlocked = achStatus.filter(a => a.unlocked).length;
        totalUnlocked += unlocked;
        totalAchievements += gameDef.achievements.length;
        totalScore += highScore;

        if (highScore > favoriteScore) {
          favoriteScore = highScore;
          favoriteGame = gameDef.name;
        }

        gameStats[gameId] = { achStatus, highScore, unlocked, total: gameDef.achievements.length };
      }

      // Add cross-game to totals
      totalAchievements += CROSS_GAME_ACHIEVEMENTS.length;
      totalUnlocked += crossUnlocked.size;

      const percent = totalAchievements > 0
        ? Math.round((totalUnlocked / totalAchievements) * 100)
        : 0;

      // ── Global Progress Bar ──────────────────────────────────────────
      document.getElementById('progress-label').textContent =
        `${totalUnlocked} / ${totalAchievements} Achievements Unlocked (${percent}%)`;
      document.getElementById('progress-fill').style.width = `${percent}%`;
      document.getElementById('progress-percent').textContent =
        percent === 100 ? 'ALL ACHIEVEMENTS UNLOCKED — TRUE GALAXY CHAMPION' : '';

      // ── Cross-Game Achievements ──────────────────────────────────────
      const crossGrid = document.getElementById('cross-game-grid');
      crossGrid.innerHTML = CROSS_GAME_ACHIEVEMENTS.map(ach => {
        const isUnlocked = crossUnlocked.has(ach.id);
        return `
          <div class="ach-card ${isUnlocked ? 'unlocked' : 'locked'}">
            <span class="ach-icon">${ach.icon}</span>
            <div class="ach-name">${escapeHTML(ach.name)}</div>
            <div class="ach-desc">${escapeHTML(ach.description)}</div>
          </div>`;
      }).join('');

      // ── Per-Game Sections ────────────────────────────────────────────
      const container = document.getElementById('game-sections');

      // Display order matching the arcade grid
      const gameOrder = [
        'pac-chase', 'space-defenders', 'asteroid-blaster', 'barrel-jump',
        'road-hopper', 'galaxy-raiders', 'brick-breaker', 'retro-tennis',
        'bug-shooter', 'city-defense', 'tunnel-hero', 'cube-hopper',
        'knight-flyer', 'star-guardian', 'neon-cycles', 'robotron',
      ];

      container.innerHTML = gameOrder.map(gameId => {
        const gameDef = ALL_GAME_ACHIEVEMENTS[gameId];
        const stats = gameStats[gameId];
        if (!gameDef || !stats) return '';

        const scoreDisplay = stats.highScore > 0
          ? `HI: ${formatNumber(stats.highScore)}`
          : 'NO SCORE YET';

        const achCards = stats.achStatus.map(ach => `
          <div class="ach-card ${ach.unlocked ? 'unlocked' : 'locked'}">
            <span class="ach-icon">${ach.icon}</span>
            <div class="ach-name">${escapeHTML(ach.name)}</div>
            <div class="ach-desc">${escapeHTML(ach.description)}</div>
          </div>`).join('');

        return `
          <section class="game-section">
            <div class="game-section-header">
              <h2 class="game-section-name">${escapeHTML(gameDef.name)}</h2>
              <span class="game-section-score">${scoreDisplay} &nbsp; (${stats.unlocked}/${stats.total})</span>
            </div>
            <div class="game-ach-grid">${achCards}</div>
          </section>`;
      }).join('');

      // ── Stats Footer ────────────────────────────────────────────────
      const gamesPlayed = globalData.gamesPlayed ? globalData.gamesPlayed.length : 0;
      document.getElementById('stat-games-played').textContent = gamesPlayed;
      document.getElementById('stat-total-score').textContent = formatNumber(totalScore);

      if (favoriteGame && favoriteScore > 0) {
        document.getElementById('stat-favorite').textContent = favoriteGame;
        document.getElementById('stat-favorite-score').textContent =
          `High Score: ${formatNumber(favoriteScore)}`;
      } else {
        document.getElementById('stat-favorite').textContent = '\u2014';
        document.getElementById('stat-favorite-score').textContent = 'Play some games!';
      }
    }

    // ── Init ─────────────────────────────────────────────────────────────
    buildPage();
  </script>

</body>
</html>
