<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes fall1 { 0%{transform:translate(0,0)} 100%{transform:translate(30px,200px)} }
    @keyframes fall2 { 0%{transform:translate(0,0)} 100%{transform:translate(-20px,180px)} }
    @keyframes fall3 { 0%{transform:translate(0,0)} 100%{transform:translate(10px,160px)} }
    @keyframes explode { 0%{r:0;opacity:1} 50%{r:25;opacity:.8} 100%{r:35;opacity:0} }
    @keyframes twinkle { 0%,100%{opacity:.3} 50%{opacity:1} }
    .missile1{animation:fall1 3s linear infinite}
    .missile2{animation:fall2 2.5s linear infinite .5s}
    .missile3{animation:fall3 2.8s linear infinite 1s}
    .boom{animation:explode 2s ease-out infinite}
    .boom2{animation:explode 2s ease-out infinite .7s}
    .boom3{animation:explode 2s ease-out infinite 1.4s}
    .star{animation:twinkle 2s ease-in-out infinite}
  </style>
  <rect width="300" height="400" fill="#0a0a1a"/>
  <!-- Stars -->
  <g class="star">
    <circle cx="20" cy="30" r="1" fill="#fff"/><circle cx="80" cy="50" r="1.5" fill="#fff"/>
    <circle cx="150" cy="20" r="1" fill="#fff"/><circle cx="220" cy="45" r="1.5" fill="#fff"/>
    <circle cx="270" cy="25" r="1" fill="#fff"/><circle cx="50" cy="80" r="1" fill="#fff"/>
    <circle cx="180" cy="70" r="1.5" fill="#fff"/><circle cx="250" cy="90" r="1" fill="#fff"/>
  </g>
  <!-- Missile trails -->
  <line class="missile1" x1="80" y1="50" x2="85" y2="70" stroke="#ff3333" stroke-width="2" filter="url(#glow)"/>
  <line class="missile2" x1="180" y1="40" x2="175" y2="60" stroke="#ff3333" stroke-width="2" filter="url(#glow)"/>
  <line class="missile3" x1="240" y1="60" x2="245" y2="80" stroke="#ff3333" stroke-width="2" filter="url(#glow)"/>
  <!-- Explosions -->
  <circle class="boom" cx="120" cy="180" fill="#ff6600" opacity="0" filter="url(#glow2)"/>
  <circle class="boom2" cx="200" cy="160" fill="#ffaa00" opacity="0" filter="url(#glow2)"/>
  <circle class="boom3" cx="70" cy="200" fill="#ffffff" opacity="0" filter="url(#glow2)"/>
  <!-- City skyline -->
  <g fill="#1a1a3a" stroke="#334" stroke-width="1">
    <rect x="10" y="330" width="30" height="70"/>
    <rect x="45" y="310" width="25" height="90"/>
    <rect x="75" y="340" width="35" height="60"/>
    <rect x="115" y="300" width="20" height="100"/>
    <rect x="140" y="325" width="30" height="75"/>
    <rect x="175" y="315" width="25" height="85"/>
    <rect x="205" y="340" width="30" height="60"/>
    <rect x="240" y="305" width="20" height="95"/>
    <rect x="265" y="330" width="30" height="70"/>
  </g>
  <!-- Windows -->
  <g fill="#ffcc00" opacity=".8">
    <rect x="16" y="340" width="4" height="4"/><rect x="24" y="350" width="4" height="4"/>
    <rect x="50" y="320" width="4" height="4"/><rect x="58" y="340" width="4" height="4"/>
    <rect x="82" y="350" width="4" height="4"/><rect x="96" y="360" width="4" height="4"/>
    <rect x="120" y="310" width="4" height="4"/><rect x="120" y="330" width="4" height="4"/>
    <rect x="148" y="335" width="4" height="4"/><rect x="155" y="355" width="4" height="4"/>
    <rect x="180" y="325" width="4" height="4"/><rect x="188" y="345" width="4" height="4"/>
    <rect x="212" y="350" width="4" height="4"/><rect x="224" y="360" width="4" height="4"/>
    <rect x="245" y="315" width="4" height="4"/><rect x="245" y="335" width="4" height="4"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="395" width="300" height="5" fill="#222244"/>
  <!-- Title -->
  <text x="150" y="35" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#ff4444" filter="url(#glow)">CITY DEFENSE</text>
</svg>