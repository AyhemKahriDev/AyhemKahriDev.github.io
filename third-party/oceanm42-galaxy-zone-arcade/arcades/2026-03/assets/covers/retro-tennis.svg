<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="motionBlur">
      <feGaussianBlur stdDeviation="8,0" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes ballMove {
      0% { transform: translate(0, 0); }
      25% { transform: translate(100px, -80px); }
      50% { transform: translate(0, -160px); }
      75% { transform: translate(-100px, -80px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes paddleL {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-60px); }
      50% { transform: translateY(-120px); }
      75% { transform: translateY(-60px); }
    }
    @keyframes paddleR {
      0%, 100% { transform: translateY(-120px); }
      25% { transform: translateY(-60px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-60px); }
    }
    @keyframes scorePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .ball { animation: ballMove 3s ease-in-out infinite; }
    .paddleLeft { animation: paddleL 3s ease-in-out infinite; }
    .paddleRight { animation: paddleR 3s ease-in-out infinite; }
    .score { animation: scorePulse 2s ease-in-out infinite; }
  </style>
  <rect width="300" height="400" fill="#0a0a1a"/>
  <!-- Center dashed line -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.4">
    <line x1="150" y1="70" x2="150" y2="85" stroke-dasharray="0"/>
    <line x1="150" y1="95" x2="150" y2="110"/>
    <line x1="150" y1="120" x2="150" y2="135"/>
    <line x1="150" y1="145" x2="150" y2="160"/>
    <line x1="150" y1="170" x2="150" y2="185"/>
    <line x1="150" y1="195" x2="150" y2="210"/>
    <line x1="150" y1="220" x2="150" y2="235"/>
    <line x1="150" y1="245" x2="150" y2="260"/>
    <line x1="150" y1="270" x2="150" y2="285"/>
    <line x1="150" y1="295" x2="150" y2="310"/>
    <line x1="150" y1="320" x2="150" y2="335"/>
    <line x1="150" y1="345" x2="150" y2="360"/>
    <line x1="150" y1="370" x2="150" y2="385"/>
  </g>
  <!-- Score -->
  <g class="score" filter="url(#glowStrong)">
    <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff">0</text>
    <text x="200" y="55" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff">0</text>
  </g>
  <!-- Left paddle -->
  <g class="paddleLeft" filter="url(#glowStrong)">
    <rect x="25" y="280" width="8" height="50" rx="3" fill="#00FFFF"/>
  </g>
  <!-- Right paddle -->
  <g class="paddleRight" filter="url(#glowStrong)">
    <rect x="267" y="280" width="8" height="50" rx="3" fill="#00FFFF"/>
  </g>
  <!-- Ball with motion trail -->
  <g class="ball">
    <circle cx="150" cy="300" r="6" fill="#00FFFF" opacity="0.15" filter="url(#motionBlur)"/>
    <circle cx="150" cy="300" r="6" fill="#88FFFF" opacity="0.3"/>
    <circle cx="150" cy="300" r="5" fill="#ffffff" filter="url(#glowStrong)"/>
  </g>
  <!-- Border lines -->
  <line x1="15" y1="65" x2="285" y2="65" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="15" y1="390" x2="285" y2="390" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <!-- Title -->
  <text x="150" y="25" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#00FFFF" filter="url(#glowStrong)">RETRO TENNIS</text>
</svg>