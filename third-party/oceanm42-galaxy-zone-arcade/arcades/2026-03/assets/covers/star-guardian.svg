<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes fly { 0%,100%{transform:translateX(0)} 50%{transform:translateX(15px)} }
    @keyframes descend { 0%{transform:translateY(0)} 100%{transform:translateY(30px)} }
    @keyframes scanline { 0%{transform:translateX(-20px)} 100%{transform:translateX(20px)} }
    @keyframes blink { 0%,100%{opacity:.6} 50%{opacity:1} }
    .ship{animation:fly 3s ease-in-out infinite}
    .alien{animation:descend 2s ease-in-out infinite alternate}
    .alien2{animation:descend 2s ease-in-out infinite alternate .5s}
    .radar-dot{animation:scanline 2s linear infinite}
    .human{animation:blink 1.5s ease-in-out infinite}
  </style>
  <rect width="300" height="400" fill="#0a0a1a"/>
  <!-- Stars -->
  <circle cx="30" cy="60" r="1" fill="#446"/><circle cx="100" cy="40" r="1" fill="#446"/>
  <circle cx="200" cy="55" r="1" fill="#446"/><circle cx="260" cy="35" r="1" fill="#446"/>
  <circle cx="70" cy="90" r="1" fill="#446"/><circle cx="170" cy="80" r="1" fill="#446"/>
  <!-- Radar bar at top -->
  <rect x="10" y="10" width="280" height="25" rx="3" fill="#0a1a0a" stroke="#00ff66" stroke-width="1"/>
  <!-- Radar terrain minimap -->
  <polyline points="15,30 40,28 60,25 90,28 120,22 140,27 170,24 200,28 230,25 250,27 285,30" fill="none" stroke="#00aa44" stroke-width="1"/>
  <!-- Radar dots -->
  <circle class="radar-dot" cx="100" cy="22" r="2" fill="#ff4444"/>
  <circle class="radar-dot" cx="180" cy="20" r="2" fill="#ff4444"/>
  <circle cx="150" cy="22" r="2" fill="#00ffff"/>
  <!-- Mountain terrain at bottom -->
  <polygon points="0,350 30,310 60,330 100,290 140,320 180,280 220,310 260,295 300,330 300,400 0,400" fill="#1a2a1a"/>
  <polygon points="0,360 50,340 90,350 130,330 170,345 210,325 250,340 300,350 300,400 0,400" fill="#0f1f0f"/>
  <!-- Ground line -->
  <line x1="0" y1="360" x2="300" y2="360" stroke="#00aa44" stroke-width="1" opacity=".5"/>
  <!-- Tiny humans on ground -->
  <g class="human" filter="url(#glow)">
    <line x1="100" y1="355" x2="100" y2="362" stroke="#00ff66" stroke-width="1.5"/>
    <circle cx="100" cy="353" r="2" fill="#00ff66"/>
    <line x1="140" y1="348" x2="140" y2="355" stroke="#00ff66" stroke-width="1.5"/>
    <circle cx="140" cy="346" r="2" fill="#00ff66"/>
    <line x1="200" y1="345" x2="200" y2="352" stroke="#00ff66" stroke-width="1.5"/>
    <circle cx="200" cy="343" r="2" fill="#00ff66"/>
  </g>
  <!-- Player ship -->
  <g class="ship" filter="url(#glow2)">
    <polygon points="80,160 110,150 110,170" fill="#00ffff"/>
    <rect x="72" y="155" width="12" height="10" fill="#00cccc"/>
    <!-- Engine exhaust -->
    <polygon points="72,157 60,160 72,163" fill="#00ff66" opacity=".7"/>
    <!-- Laser -->
    <line x1="110" y1="160" x2="200" y2="160" stroke="#00ffff" stroke-width="1" opacity=".6"/>
  </g>
  <!-- Aliens -->
  <g class="alien" filter="url(#glow)">
    <polygon points="210,180 220,170 230,180 225,190 215,190" fill="#ff4444"/>
    <circle cx="220" cy="178" r="3" fill="#ff8888"/>
  </g>
  <g class="alien2" filter="url(#glow)">
    <polygon points="240,200 250,190 260,200 255,210 245,210" fill="#ff4444"/>
    <circle cx="250" cy="198" r="3" fill="#ff8888"/>
  </g>
  <g class="alien" filter="url(#glow)">
    <polygon points="180,220 190,210 200,220 195,230 185,230" fill="#ff6644"/>
    <circle cx="190" cy="218" r="3" fill="#ff8888"/>
  </g>
  <!-- Title -->
  <text x="150" y="390" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#00ffcc" filter="url(#glow)">STAR GUARDIAN</text>
</svg>