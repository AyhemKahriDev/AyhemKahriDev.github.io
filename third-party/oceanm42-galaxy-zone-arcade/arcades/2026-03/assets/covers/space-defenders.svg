<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes march {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(30px); }
    }
    @keyframes shoot {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-250px); opacity: 0; }
    }
    @keyframes blink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0.3; }
    }
    .aliens { animation: march 2s ease-in-out infinite; }
    .bullet { animation: shoot 1s linear infinite; }
    .bullet2 { animation: shoot 1s linear infinite; animation-delay: 0.5s; }
  </style>
  <rect width="300" height="400" fill="#0a0a1a"/>
  <!-- Stars -->
  <circle cx="20" cy="30" r="1" fill="#0f0" opacity="0.4"/>
  <circle cx="80" cy="15" r="1" fill="#0f0" opacity="0.3"/>
  <circle cx="250" cy="45" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="180" cy="20" r="1" fill="#0f0" opacity="0.5"/>
  <!-- Alien rows -->
  <g class="aliens" filter="url(#glow)">
    <!-- Row 1 - top aliens (squid type) -->
    <g fill="#00FF00">
      <path d="M60,100 h4 v4 h4 v4 h-4 v4 h-12 v-4 h-4 v-4 h4 v-4z" />
      <path d="M110,100 h4 v4 h4 v4 h-4 v4 h-12 v-4 h-4 v-4 h4 v-4z" />
      <path d="M160,100 h4 v4 h4 v4 h-4 v4 h-12 v-4 h-4 v-4 h4 v-4z" />
      <path d="M210,100 h4 v4 h4 v4 h-4 v4 h-12 v-4 h-4 v-4 h4 v-4z" />
      <path d="M260,100 h4 v4 h4 v4 h-4 v4 h-12 v-4 h-4 v-4 h4 v-4z" />
    </g>
    <!-- Row 2 - crab type -->
    <g fill="#44FF44">
      <rect x="48" y="135" width="20" height="4"/><rect x="52" y="139" width="12" height="8"/><rect x="48" y="147" width="4" height="4"/><rect x="64" y="147" width="4" height="4"/>
      <rect x="98" y="135" width="20" height="4"/><rect x="102" y="139" width="12" height="8"/><rect x="98" y="147" width="4" height="4"/><rect x="114" y="147" width="4" height="4"/>
      <rect x="148" y="135" width="20" height="4"/><rect x="152" y="139" width="12" height="8"/><rect x="148" y="147" width="4" height="4"/><rect x="164" y="147" width="4" height="4"/>
      <rect x="198" y="135" width="20" height="4"/><rect x="202" y="139" width="12" height="8"/><rect x="198" y="147" width="4" height="4"/><rect x="214" y="147" width="4" height="4"/>
      <rect x="248" y="135" width="20" height="4"/><rect x="252" y="139" width="12" height="8"/><rect x="248" y="147" width="4" height="4"/><rect x="264" y="147" width="4" height="4"/>
    </g>
    <!-- Row 3 -->
    <g fill="#88FF88">
      <rect x="50" y="170" width="16" height="12" rx="2"/><rect x="46" y="178" width="4" height="6"/><rect x="66" y="178" width="4" height="6"/>
      <rect x="100" y="170" width="16" height="12" rx="2"/><rect x="96" y="178" width="4" height="6"/><rect x="116" y="178" width="4" height="6"/>
      <rect x="150" y="170" width="16" height="12" rx="2"/><rect x="146" y="178" width="4" height="6"/><rect x="166" y="178" width="4" height="6"/>
      <rect x="200" y="170" width="16" height="12" rx="2"/><rect x="196" y="178" width="4" height="6"/><rect x="216" y="178" width="4" height="6"/>
      <rect x="250" y="170" width="16" height="12" rx="2"/><rect x="246" y="178" width="4" height="6"/><rect x="266" y="178" width="4" height="6"/>
    </g>
  </g>
  <!-- Shields -->
  <g fill="#00FF00" opacity="0.6">
    <rect x="40" y="300" width="30" height="20" rx="4"/>
    <rect x="130" y="300" width="30" height="20" rx="4"/>
    <rect x="220" y="300" width="30" height="20" rx="4"/>
  </g>
  <!-- Cannon -->
  <g filter="url(#glow)">
    <rect x="140" y="350" width="20" height="10" fill="#00FF00"/>
    <rect x="147" y="342" width="6" height="10" fill="#00FF00"/>
  </g>
  <!-- Bullets -->
  <line x1="150" y1="340" x2="150" y2="330" stroke="#fff" stroke-width="2" class="bullet" filter="url(#glowStrong)"/>
  <line x1="150" y1="340" x2="150" y2="330" stroke="#fff" stroke-width="2" class="bullet2" filter="url(#glowStrong)"/>
  <!-- Title -->
  <text x="150" y="50" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#00FF00" filter="url(#glowStrong)">SPACE DEFENDERS</text>
  <!-- Score -->
  <text x="150" y="390" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.7">SCORE 0000</text>
</svg>