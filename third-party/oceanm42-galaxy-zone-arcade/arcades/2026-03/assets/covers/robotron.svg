<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes borderPulse { 0%,100%{opacity:.6;stroke-width:2} 50%{opacity:1;stroke-width:4} }
    @keyframes shoot { 0%{opacity:1} 100%{opacity:.2} }
    @keyframes swarm1 { 0%,100%{transform:translate(0,0)} 25%{transform:translate(8px,5px)} 50%{transform:translate(-3px,8px)} 75%{transform:translate(-6px,-4px)} }
    @keyframes swarm2 { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-5px,7px)} 50%{transform:translate(6px,-3px)} 75%{transform:translate(4px,-8px)} }
    @keyframes swarm3 { 0%,100%{transform:translate(0,0)} 25%{transform:translate(7px,-6px)} 50%{transform:translate(-8px,4px)} 75%{transform:translate(3px,7px)} }
    @keyframes playerSpin { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(5deg)} }
    @keyframes humanWalk { 0%,100%{transform:translateX(0)} 50%{transform:translateX(8px)} }
    @keyframes rainbow { 0%{stroke:#ff0000} 14%{stroke:#ff8800} 28%{stroke:#ffff00} 42%{stroke:#00ff00} 57%{stroke:#00ffff} 71%{stroke:#4444ff} 85%{stroke:#ff00ff} 100%{stroke:#ff0000} }
    .border{animation:borderPulse 1.5s ease-in-out infinite, rainbow 4s linear infinite}
    .bullet{animation:shoot .8s linear infinite}
    .bullet2{animation:shoot .8s linear infinite .2s}
    .bullet3{animation:shoot .8s linear infinite .4s}
    .bullet4{animation:shoot .8s linear infinite .6s}
    .grunts{animation:swarm1 2s ease-in-out infinite}
    .hulks{animation:swarm2 3s ease-in-out infinite}
    .brains{animation:swarm3 2.5s ease-in-out infinite}
    .player{animation:playerSpin 1s ease-in-out infinite;transform-origin:150px 200px}
    .family{animation:humanWalk 2s ease-in-out infinite}
  </style>
  <rect width="300" height="400" fill="#050508"/>
  <!-- Electric border -->
  <rect class="border" x="12" y="40" width="276" height="320" rx="3" fill="none" stroke="#ff00ff" stroke-width="3" filter="url(#glow2)"/>
  <!-- Inner glow border -->
  <rect class="border" x="12" y="40" width="276" height="320" rx="3" fill="none" stroke="#ff00ff" stroke-width="8" opacity=".15" filter="url(#glow3)"/>
  <!-- Player in center -->
  <g class="player" filter="url(#glow)">
    <rect x="144" y="192" width="12" height="16" fill="#ffffff"/>
    <circle cx="150" cy="189" r="5" fill="#ffffff"/>
    <!-- Legs -->
    <line x1="147" y1="208" x2="143" y2="215" stroke="#fff" stroke-width="2"/>
    <line x1="153" y1="208" x2="157" y2="215" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- Bullet lines emanating from player -->
  <line class="bullet" x1="150" y1="190" x2="150" y2="60" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <line class="bullet2" x1="150" y1="190" x2="50" y2="80" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <line class="bullet3" x1="150" y1="190" x2="250" y2="80" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <line class="bullet4" x1="150" y1="210" x2="80" y2="340" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <line class="bullet" x1="150" y1="210" x2="220" y2="340" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <line class="bullet2" x1="155" y1="200" x2="270" y2="200" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <line class="bullet3" x1="145" y1="200" x2="30" y2="200" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <line class="bullet4" x1="150" y1="210" x2="150" y2="345" stroke="#ffff00" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Blue grunts -->
  <g class="grunts">
    <circle cx="60" cy="100" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="85" cy="120" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="45" cy="150" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="70" cy="170" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="230" cy="110" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="250" cy="140" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="220" cy="160" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="90" cy="270" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="60" cy="290" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="210" cy="280" r="5" fill="#4444ff" filter="url(#glow)"/>
    <circle cx="240" cy="300" r="5" fill="#4444ff" filter="url(#glow)"/>
  </g>
  <!-- Green hulks (bigger) -->
  <g class="hulks">
    <rect x="30" y="230" width="12" height="14" rx="2" fill="#00cc44" filter="url(#glow)"/>
    <rect x="245" y="240" width="12" height="14" rx="2" fill="#00cc44" filter="url(#glow)"/>
    <rect x="100" cy="90" y="80" width="12" height="14" rx="2" fill="#00cc44" filter="url(#glow)"/>
    <rect x="200" y="300" width="12" height="14" rx="2" fill="#00cc44" filter="url(#glow)"/>
  </g>
  <!-- Orange brains -->
  <g class="brains">
    <circle cx="110" cy="140" r="7" fill="#ff8800" filter="url(#glow)"/>
    <path d="M106,138 Q110,134 114,138" stroke="#cc5500" stroke-width="1" fill="none"/>
    <circle cx="200" cy="250" r="7" fill="#ff8800" filter="url(#glow)"/>
    <path d="M196,248 Q200,244 204,248" stroke="#cc5500" stroke-width="1" fill="none"/>
    <circle cx="180" cy="100" r="7" fill="#ff8800" filter="url(#glow)"/>
    <path d="M176,98 Q180,94 184,98" stroke="#cc5500" stroke-width="1" fill="none"/>
  </g>
  <!-- Electrodes (diamond shapes) -->
  <polygon points="50,180 55,175 60,180 55,185" fill="#ff00ff" filter="url(#glow)"/>
  <polygon points="240,180 245,175 250,180 245,185" fill="#ff00ff" filter="url(#glow)"/>
  <polygon points="140,300 145,295 150,300 145,305" fill="#ff00ff" filter="url(#glow)"/>
  <!-- Human family -->
  <g class="family" filter="url(#glow)">
    <!-- Dad -->
    <line x1="120" y1="240" x2="120" y2="250" stroke="#00ff66" stroke-width="1.5"/>
    <circle cx="120" cy="238" r="3" fill="#00ff66"/>
    <!-- Mom -->
    <line x1="128" y1="241" x2="128" y2="250" stroke="#ff66aa" stroke-width="1.5"/>
    <circle cx="128" cy="239" r="3" fill="#ff66aa"/>
    <!-- Kid -->
    <line x1="124" y1="244" x2="124" y2="250" stroke="#66ffff" stroke-width="1"/>
    <circle cx="124" cy="242" r="2" fill="#66ffff"/>
  </g>
  <!-- Title -->
  <text x="150" y="28" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ff00ff" filter="url(#glow2)">ROBOTRON</text>
  <!-- Score display flavor -->
  <text x="150" y="385" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffff00" opacity=".7">LAST HUMAN FAMILY</text>
</svg>