<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="lavaGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#cc2200"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes flap { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-8px) rotate(-3deg)} }
    @keyframes enemyFlap { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
    @keyframes spark { 0%{opacity:1;r:2} 100%{opacity:0;r:6} }
    @keyframes lavaWave { 0%,100%{d:path('M0,375 Q75,365 150,375 Q225,385 300,375 L300,400 L0,400Z')} 50%{d:path('M0,378 Q75,385 150,372 Q225,365 300,378 L300,400 L0,400Z')} }
    @keyframes glow-pulse { 0%,100%{opacity:.5} 50%{opacity:.9} }
    .hero{animation:flap 1.2s ease-in-out infinite}
    .enemy{animation:enemyFlap 1s ease-in-out infinite}
    .spark{animation:spark 1s ease-out infinite}
    .spark2{animation:spark 1s ease-out infinite .3s}
    .spark3{animation:spark 1s ease-out infinite .6s}
    .lava-glow{animation:glow-pulse 2s ease-in-out infinite}
  </style>
  <rect width="300" height="400" fill="#0a0a12"/>
  <!-- Cavern walls -->
  <polygon points="0,0 40,30 20,80 0,60" fill="#2a1a1a"/>
  <polygon points="300,0 260,25 280,70 300,50" fill="#2a1a1a"/>
  <polygon points="0,0 300,0 280,15 20,15" fill="#221515"/>
  <!-- Stalactites -->
  <polygon points="70,0 75,40 80,0" fill="#332222"/>
  <polygon points="140,0 145,35 150,0" fill="#332222"/>
  <polygon points="220,0 225,45 230,0" fill="#332222"/>
  <!-- Stone platforms -->
  <rect x="20" y="200" width="70" height="12" rx="3" fill="#444433"/>
  <rect x="120" y="160" width="60" height="12" rx="3" fill="#444433"/>
  <rect x="210" y="230" width="70" height="12" rx="3" fill="#444433"/>
  <rect x="60" y="300" width="80" height="12" rx="3" fill="#444433"/>
  <rect x="190" y="310" width="65" height="12" rx="3" fill="#444433"/>
  <!-- Lava pool at bottom -->
  <rect x="0" y="370" width="300" height="30" fill="url(#lava)" filter="url(#lavaGlow)"/>
  <ellipse class="lava-glow" cx="150" cy="370" rx="150" ry="15" fill="#ff6600" opacity=".5" filter="url(#lavaGlow)"/>
  <!-- Hero knight on bird -->
  <g class="hero" filter="url(#glow)">
    <!-- Bird body -->
    <ellipse cx="140" cy="140" rx="20" ry="10" fill="#dddd44"/>
    <!-- Wings -->
    <polygon points="125,135 110,120 135,130" fill="#eeee66"/>
    <polygon points="155,135 170,120 145,130" fill="#eeee66"/>
    <!-- Bird head -->
    <circle cx="160" cy="132" r="6" fill="#dddd44"/>
    <circle cx="163" cy="130" r="1.5" fill="#000"/>
    <polygon points="166,132 175,130 166,134" fill="#ff8800"/>
    <!-- Knight -->
    <rect x="134" y="118" width="12" height="14" fill="#8888cc"/>
    <circle cx="140" cy="114" r="7" fill="#9999dd"/>
    <!-- Lance -->
    <line x1="150" y1="125" x2="175" y2="115" stroke="#cccccc" stroke-width="2"/>
  </g>
  <!-- Enemy knight -->
  <g class="enemy">
    <ellipse cx="230" cy="170" rx="16" ry="8" fill="#884422"/>
    <polygon points="218,166 208,155 226,162" fill="#996633"/>
    <rect x="225" y="156" width="10" height="10" fill="#cc4444"/>
    <circle cx="230" cy="152" r="5" fill="#dd5555"/>
  </g>
  <!-- Combat sparks -->
  <circle class="spark" cx="180" cy="130" fill="#ffff00" r="2" filter="url(#glow)"/>
  <circle class="spark2" cx="185" cy="125" fill="#ff4400" r="2" filter="url(#glow)"/>
  <circle class="spark3" cx="175" cy="135" fill="#ffaa00" r="2" filter="url(#glow)"/>
  <!-- Title -->
  <text x="150" y="35" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#dddd44" filter="url(#glow)">KNIGHT FLYER</text>
</svg>