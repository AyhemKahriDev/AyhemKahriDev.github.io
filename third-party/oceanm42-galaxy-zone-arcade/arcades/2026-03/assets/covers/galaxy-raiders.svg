<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes formation { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
    @keyframes swoop {
      0% { transform: translate(0,0); }
      25% { transform: translate(-40px, 60px); }
      50% { transform: translate(-20px, 120px); }
      75% { transform: translate(30px, 80px); }
      100% { transform: translate(0,0); }
    }
    @keyframes laserShot {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-200px); opacity: 0; }
    }
    @keyframes enemyLaser {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(150px); opacity: 0; }
    }
    .stars circle { animation: twinkle 2s ease-in-out infinite; }
    .stars circle:nth-child(odd) { animation-delay: 0.5s; }
    .formation { animation: formation 3s ease-in-out infinite; }
    .swooper { animation: swoop 3s ease-in-out infinite; }
    .laser { animation: laserShot 0.8s linear infinite; }
    .elaser { animation: enemyLaser 1.2s linear infinite; animation-delay: 0.4s; }
  </style>
  <rect width="300" height="400" fill="#0a0a1a"/>
  <!-- Stars -->
  <g class="stars" fill="#fff">
    <circle cx="20" cy="40" r="1"/><circle cx="60" cy="80" r="0.7"/><circle cx="100" cy="25" r="0.8"/>
    <circle cx="180" cy="55" r="0.6"/><circle cx="240" cy="30" r="1"/><circle cx="270" cy="90" r="0.7"/>
    <circle cx="30" cy="200" r="0.5"/><circle cx="280" cy="250" r="0.8"/><circle cx="15" cy="350" r="0.6"/>
    <circle cx="285" cy="370" r="0.7"/><circle cx="140" cy="380" r="0.5"/>
  </g>
  <!-- Alien formation -->
  <g class="formation" filter="url(#glow)">
    <!-- Row 1 - boss aliens -->
    <g fill="#FF0000">
      <polygon points="90,90 95,80 100,84 105,80 110,90 105,95 95,95"/><circle cx="100" cy="86" r="2" fill="#fff"/>
      <polygon points="140,90 145,80 150,84 155,80 160,90 155,95 145,95"/><circle cx="150" cy="86" r="2" fill="#fff"/>
      <polygon points="190,90 195,80 200,84 205,80 210,90 205,95 195,95"/><circle cx="200" cy="86" r="2" fill="#fff"/>
    </g>
    <!-- Row 2 -->
    <g fill="#FF00FF">
      <rect x="68" y="115" width="12" height="10" rx="2"/><rect x="98" y="115" width="12" height="10" rx="2"/>
      <rect x="128" y="115" width="12" height="10" rx="2"/><rect x="158" y="115" width="12" height="10" rx="2"/>
      <rect x="188" y="115" width="12" height="10" rx="2"/><rect x="218" y="115" width="12" height="10" rx="2"/>
    </g>
    <!-- Row 3 -->
    <g fill="#00FFFF">
      <circle cx="75" cy="145" r="6"/><circle cx="105" cy="145" r="6"/><circle cx="135" cy="145" r="6"/>
      <circle cx="165" cy="145" r="6"/><circle cx="195" cy="145" r="6"/><circle cx="225" cy="145" r="6"/>
    </g>
    <!-- Row 4 -->
    <g fill="#FFFF00">
      <circle cx="75" cy="170" r="5"/><circle cx="105" cy="170" r="5"/><circle cx="135" cy="170" r="5"/>
      <circle cx="165" cy="170" r="5"/><circle cx="195" cy="170" r="5"/><circle cx="225" cy="170" r="5"/>
    </g>
  </g>
  <!-- Swooping alien -->
  <g class="swooper" filter="url(#glowStrong)">
    <polygon points="150,90 155,80 160,84 165,80 170,90 165,95 155,95" fill="#FF0000"/>
    <polygon points="148,95 155,100 165,100 172,95" fill="#FF4444"/>
  </g>
  <!-- Enemy laser -->
  <line x1="160" y1="100" x2="160" y2="115" stroke="#FF4444" stroke-width="2" class="elaser" filter="url(#glow)"/>
  <!-- Player ship -->
  <g filter="url(#glowStrong)">
    <polygon points="150,340 140,360 150,355 160,360" fill="#00FF00" stroke="#88FF88" stroke-width="0.5"/>
    <rect x="145" y="355" width="10" height="5" fill="#00CC00"/>
  </g>
  <!-- Player laser -->
  <line x1="150" y1="335" x2="150" y2="320" stroke="#00FF00" stroke-width="2" class="laser" filter="url(#glowStrong)"/>
  <!-- Title -->
  <text x="150" y="45" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#FF00FF" filter="url(#glowStrong)">GALAXY RAIDERS</text>
  <text x="150" y="390" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFF00" opacity="0.7">STAGE 1</text>
</svg>