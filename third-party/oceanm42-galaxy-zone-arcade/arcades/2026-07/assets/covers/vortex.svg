<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Vortex cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#a94dff" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#ffe600" stroke-width="1.5" opacity="0.35"/>

  <!-- the well: near rim (16-gon) -->
  <polygon points="200.0,90.0 257.4,96.1 306.1,113.4 338.6,139.4 350.0,170.0 338.6,200.6 306.1,226.6 257.4,243.9 200.0,250.0 142.6,243.9 93.9,226.6 61.4,200.6 50.0,170.0 61.4,139.4 93.9,113.4 142.6,96.1"
           fill="none" stroke="#a94dff" stroke-width="2"/>

  <!-- far rim, scaled toward the vanishing point -->
  <polygon points="200.0,123.2 209.2,124.2 217.0,126.9 222.2,131.1 224.0,136.0 222.2,140.9 217.0,145.1 209.2,147.8 200.0,148.8 190.8,147.8 183.0,145.1 177.8,140.9 176.0,136.0 177.8,131.1 183.0,126.9 190.8,124.2"
           fill="none" stroke="#a94dff" stroke-width="1.5" opacity="0.8"/>

  <!-- lane spokes -->
  <g stroke="#a94dff" stroke-width="1.5" opacity="0.55">
    <line x1="200.0" y1="90.0" x2="200.0" y2="123.2"/>
    <line x1="257.4" y1="96.1" x2="209.2" y2="124.2"/>
    <line x1="306.1" y1="113.4" x2="217.0" y2="126.9"/>
    <line x1="338.6" y1="139.4" x2="222.2" y2="131.1"/>
    <line x1="350.0" y1="170.0" x2="224.0" y2="136.0"/>
    <line x1="338.6" y1="200.6" x2="222.2" y2="140.9"/>
    <line x1="306.1" y1="226.6" x2="217.0" y2="145.1"/>
    <line x1="257.4" y1="243.9" x2="209.2" y2="147.8"/>
    <line x1="200.0" y1="250.0" x2="200.0" y2="148.8"/>
    <line x1="142.6" y1="243.9" x2="190.8" y2="147.8"/>
    <line x1="93.9" y1="226.6" x2="183.0" y2="145.1"/>
    <line x1="61.4" y1="200.6" x2="177.8" y2="140.9"/>
    <line x1="50.0" y1="170.0" x2="176.0" y2="136.0"/>
    <line x1="61.4" y1="139.4" x2="177.8" y2="131.1"/>
    <line x1="93.9" y1="113.4" x2="183.0" y2="126.9"/>
    <line x1="142.6" y1="96.1" x2="190.8" y2="124.2"/>
  </g>

  <!-- the player's lane, lit -->
  <polygon points="257.4,243.9 200.0,250.0 200.0,148.8 209.2,147.8"
           fill="#ffe600" opacity="0.14"/>
  <polygon points="257.4,243.9 200.0,250.0 200.0,148.8 209.2,147.8"
           fill="none" stroke="#ffe600" stroke-width="1.5" opacity="0.6"/>

  <!-- bolts streaking down the lit lane -->
  <circle cx="219.1" cy="207.5" r="4" fill="#ffe600"/>
  <circle cx="219.1" cy="207.5" r="4" fill="none" stroke="#ffe600" stroke-width="5" opacity="0.35"/>
  <circle cx="211.8" cy="177.9" r="2.5" fill="#ffe600" opacity="0.7"/>

  <!-- enemies climbing distant lanes (diamond flippers, accent only) -->
  <g fill="#a94dff">
    <path d="M 116.3 144.1 l 6 0 l -6 8 l -6 -8 Z" opacity="0.9"/>
    <path d="M 255.5 128.1 l 4.5 0 l -4.5 6 l -4.5 -6 Z" opacity="0.75"/>
  </g>

  <!-- the player claw, straddling the rim of its lane -->
  <g transform="translate(228.7,251.5) rotate(-16)">
    <path d="M 0 -8 L 13 10 L 4.5 5 L 0 12 L -4.5 5 L -13 10 Z" fill="#ffe600"/>
    <path d="M 0 -8 L 13 10 L 4.5 5 L 0 12 L -4.5 5 L -13 10 Z" fill="none" stroke="#ffe600" stroke-width="5" opacity="0.35"/>
  </g>
</svg>
