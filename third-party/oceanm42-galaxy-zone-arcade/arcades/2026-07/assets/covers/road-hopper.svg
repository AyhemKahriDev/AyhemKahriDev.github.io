<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Road Hopper cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#39ff6a" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.3"/>

  <!-- river band -->
  <rect x="16" y="60" width="368" height="70" fill="#031a33"/>
  <!-- road band -->
  <rect x="16" y="170" width="368" height="70" fill="#141414"/>
  <g stroke="#ffe600" stroke-width="3" stroke-dasharray="14 10" opacity="0.4">
    <line x1="16" y1="205" x2="384" y2="205"/>
  </g>

  <!-- log -->
  <rect x="60" y="82" width="90" height="24" rx="6" fill="#8b5a2b" stroke="#5a3a1a" stroke-width="1.5"/>
  <!-- turtles -->
  <circle cx="270" cy="94" r="16" fill="#39ff6a"/>
  <circle cx="300" cy="94" r="16" fill="#39ff6a"/>

  <!-- car -->
  <rect x="230" y="190" width="60" height="32" rx="5" fill="#ff3355"/>
  <rect x="238" y="198" width="10" height="8" fill="#eaf6ff"/>

  <!-- frog hero shape, mid-hop -->
  <g>
    <circle cx="160" cy="150" r="22" fill="#39ff6a"/>
    <circle cx="160" cy="150" r="22" fill="none" stroke="#39ff6a" stroke-width="6" opacity="0.3"/>
    <circle cx="152" cy="144" r="3.5" fill="#0a0a14"/>
    <circle cx="168" cy="144" r="3.5" fill="#0a0a14"/>
  </g>

  <!-- home bay marker -->
  <rect x="176" y="18" width="48" height="28" rx="4" fill="none" stroke="#39ff6a" stroke-width="2" opacity="0.8"/>
</svg>
