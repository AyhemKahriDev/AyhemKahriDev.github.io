<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Retro Tennis cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#eaf6ff" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#ff2ec4" stroke-width="1.5" opacity="0.35"/>

  <!-- center dashed line -->
  <g stroke="#eaf6ff" stroke-width="3" stroke-dasharray="10 12" opacity="0.35">
    <line x1="200" y1="24" x2="200" y2="276"/>
  </g>

  <!-- player paddle (left, white) -->
  <g>
    <rect x="46" y="118" width="16" height="64" rx="3" fill="#eaf6ff"/>
    <rect x="46" y="118" width="16" height="64" rx="3" fill="none" stroke="#eaf6ff" stroke-width="6" opacity="0.35"/>
  </g>

  <!-- AI paddle (right, magenta) -->
  <g>
    <rect x="338" y="150" width="16" height="64" rx="3" fill="#ff2ec4"/>
    <rect x="338" y="150" width="16" height="64" rx="3" fill="none" stroke="#ff2ec4" stroke-width="6" opacity="0.35"/>
  </g>

  <!-- ball with motion trail -->
  <circle cx="150" cy="150" r="5" fill="#ffe600" opacity="0.18"/>
  <circle cx="175" cy="145" r="6" fill="#ffe600" opacity="0.32"/>
  <circle cx="202" cy="140" r="7" fill="#ffe600" opacity="0.55"/>
  <circle cx="232" cy="134" r="9" fill="#ffe600"/>
  <circle cx="232" cy="134" r="9" fill="none" stroke="#ffe600" stroke-width="7" opacity="0.4"/>
</svg>
