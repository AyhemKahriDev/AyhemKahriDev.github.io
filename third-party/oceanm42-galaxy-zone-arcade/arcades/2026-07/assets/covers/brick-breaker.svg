<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Brick Breaker cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#ff2ec4" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.35"/>

  <!-- brick wall, alternating accent/secondary, with a gap punched through -->
  <g>
    <!-- row 1 -->
    <rect x="40" y="46" width="52" height="20" rx="2" fill="#ff2ec4"/>
    <rect x="98" y="46" width="52" height="20" rx="2" fill="#00f0ff"/>
    <rect x="156" y="46" width="52" height="20" rx="2" fill="#ff2ec4"/>
    <!-- gap: brick broken through -->
    <rect x="272" y="46" width="52" height="20" rx="2" fill="#00f0ff"/>
    <rect x="330" y="46" width="30" height="20" rx="2" fill="#ff2ec4"/>

    <!-- row 2 -->
    <rect x="40" y="70" width="52" height="20" rx="2" fill="#00f0ff"/>
    <rect x="98" y="70" width="52" height="20" rx="2" fill="#ff2ec4"/>
    <rect x="156" y="70" width="52" height="20" rx="2" fill="#00f0ff"/>
    <rect x="214" y="70" width="52" height="20" rx="2" fill="#ff2ec4"/>
    <rect x="272" y="70" width="52" height="20" rx="2" fill="#00f0ff"/>
    <rect x="330" y="70" width="30" height="20" rx="2" fill="#ff2ec4"/>

    <!-- row 3 -->
    <rect x="40" y="94" width="52" height="20" rx="2" fill="#ff2ec4" opacity="0.85"/>
    <rect x="98" y="94" width="52" height="20" rx="2" fill="#00f0ff" opacity="0.85"/>
    <rect x="214" y="94" width="52" height="20" rx="2" fill="#00f0ff" opacity="0.85"/>
    <rect x="272" y="94" width="52" height="20" rx="2" fill="#ff2ec4" opacity="0.85"/>
    <rect x="330" y="94" width="30" height="20" rx="2" fill="#00f0ff" opacity="0.85"/>
  </g>

  <!-- ball with motion trail, punching through the gap -->
  <circle cx="150" cy="150" r="4" fill="#eaf6ff" opacity="0.15"/>
  <circle cx="172" cy="132" r="5" fill="#eaf6ff" opacity="0.3"/>
  <circle cx="196" cy="114" r="6" fill="#eaf6ff" opacity="0.55"/>
  <circle cx="222" cy="96" r="8" fill="#eaf6ff"/>
  <circle cx="222" cy="96" r="8" fill="none" stroke="#eaf6ff" stroke-width="6" opacity="0.4"/>

  <!-- impact burst at the broken brick -->
  <g stroke="#ffe600" stroke-width="2" opacity="0.8">
    <line x1="240" y1="96" x2="252" y2="88"/>
    <line x1="240" y1="106" x2="252" y2="112"/>
    <line x1="238" y1="116" x2="246" y2="126"/>
  </g>

  <!-- paddle -->
  <rect x="150" y="234" width="100" height="14" rx="4" fill="#ff2ec4"/>
  <rect x="150" y="234" width="100" height="14" rx="4" fill="none" stroke="#ff2ec4" stroke-width="6" opacity="0.35"/>
</svg>
