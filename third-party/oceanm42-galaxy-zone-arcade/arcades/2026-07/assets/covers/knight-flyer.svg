<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Knight Flyer cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#ffe600" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#ff3355" stroke-width="1.5" opacity="0.3"/>

  <!-- lava band -->
  <rect x="0" y="264" width="400" height="36" fill="#ff3355" opacity="0.85"/>
  <rect x="0" y="264" width="400" height="10" fill="#ff8a00" opacity="0.9"/>

  <!-- floating stone platforms -->
  <rect x="30" y="230" width="90" height="12" fill="#12121c" stroke="#ffe600" stroke-width="2"/>
  <rect x="280" y="230" width="90" height="12" fill="#12121c" stroke="#ffe600" stroke-width="2"/>
  <rect x="150" y="150" width="100" height="12" fill="#12121c" stroke="#ffe600" stroke-width="2"/>

  <!-- egg on the left platform -->
  <ellipse cx="60" cy="216" rx="8" ry="11" fill="#ff3355"/>

  <!-- enemy rider, upper right, lower altitude (would lose a joust) -->
  <g transform="translate(300,120)">
    <polygon points="12,0 -8,-7 -3,0 -8,7" fill="#a9a9c0"/>
    <line x1="-3" y1="-3" x2="-13" y2="-9" stroke="#eaf6ff" stroke-width="2"/>
    <line x1="-3" y1="3" x2="-13" y2="9" stroke="#eaf6ff" stroke-width="2"/>
  </g>

  <!-- hero shape: knight mount, center, higher altitude, wings extended (flapping) -->
  <g transform="translate(190,90)">
    <polygon points="20,0 -14,-13 -5,0 -14,13" fill="#ffe600"/>
    <polygon points="20,0 -14,-13 -5,0 -14,13" fill="none" stroke="#ffe600" stroke-width="6" opacity="0.3"/>
    <line x1="-5" y1="-5" x2="-22" y2="-16" stroke="#eaf6ff" stroke-width="2.5"/>
    <line x1="-5" y1="5" x2="-22" y2="16" stroke="#eaf6ff" stroke-width="2.5"/>
  </g>
</svg>
