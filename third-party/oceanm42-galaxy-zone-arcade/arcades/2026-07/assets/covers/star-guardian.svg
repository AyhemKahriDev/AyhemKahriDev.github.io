<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Star Guardian cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#ff3355" stroke-width="1.5" opacity="0.3"/>

  <!-- stars -->
  <g fill="#eaf6ff" opacity="0.4">
    <circle cx="40" cy="40" r="1.3"/>
    <circle cx="90" cy="70" r="1.1"/>
    <circle cx="330" cy="50" r="1.3"/>
    <circle cx="300" cy="90" r="1.1"/>
    <circle cx="60" cy="100" r="1.1"/>
  </g>

  <!-- mountain silhouette terrain -->
  <path d="M0,230 L40,205 L80,222 L120,190 L160,215 L200,180 L240,210 L280,195 L320,220 L360,200 L400,225 L400,300 L0,300 Z"
    fill="#12121c" stroke="#00f0ff" stroke-width="2" opacity="0.9"/>

  <!-- humanoid on the ground -->
  <g fill="#eaf6ff">
    <rect x="97" y="200" width="6" height="14"/>
    <circle cx="100" cy="196" r="4"/>
  </g>

  <!-- lander swooping in, upper right, abducting -->
  <g>
    <path d="M300,90 L322,78 L344,90 L322,102 Z" fill="none" stroke="#ff3355" stroke-width="2"/>
    <line x1="322" y1="102" x2="322" y2="130" stroke="#ff3355" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- hero shape: guardian ship, center, facing right -->
  <g transform="translate(190,150)">
    <polygon points="34,0 -22,-22 -6,0 -22,22" fill="#00f0ff"/>
    <polygon points="34,0 -22,-22 -6,0 -22,22" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.3"/>
  </g>

  <!-- laser beam -->
  <line x1="224" y1="150" x2="266" y2="150" stroke="#ffe600" stroke-width="4" stroke-linecap="round"/>
</svg>
