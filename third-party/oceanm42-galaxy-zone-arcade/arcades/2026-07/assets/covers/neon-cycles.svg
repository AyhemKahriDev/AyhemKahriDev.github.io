<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Neon Cycles cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#ff8a00" stroke-width="1.5" opacity="0.35"/>

  <!-- faint arena grid -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.10">
    <line x1="100" y1="24" x2="100" y2="276"/>
    <line x1="200" y1="24" x2="200" y2="276"/>
    <line x1="300" y1="24" x2="300" y2="276"/>
    <line x1="24" y1="100" x2="376" y2="100"/>
    <line x1="24" y1="200" x2="376" y2="200"/>
  </g>

  <!-- cyan player trail: right-angle path ending in a bright head -->
  <g fill="none" stroke="#00f0ff" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M 50 250 L 50 120 L 180 120 L 180 190 L 290 190" opacity="0.9"/>
  </g>
  <path d="M 50 250 L 50 120 L 180 120 L 180 190 L 290 190" fill="none" stroke="#00f0ff" stroke-width="14" opacity="0.18"/>
  <circle cx="290" cy="190" r="11" fill="#00f0ff"/>
  <circle cx="290" cy="190" r="11" fill="none" stroke="#00f0ff" stroke-width="7" opacity="0.4"/>
  <circle cx="290" cy="190" r="4.5" fill="#eaf6ff"/>

  <!-- orange rival trail crossing, about to be cut off -->
  <g fill="none" stroke="#ff8a00" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M 350 60 L 240 60 L 240 140 L 320 140 L 320 230" opacity="0.9"/>
  </g>
  <path d="M 350 60 L 240 60 L 240 140 L 320 140 L 320 230" fill="none" stroke="#ff8a00" stroke-width="14" opacity="0.18"/>
  <circle cx="320" cy="230" r="9" fill="#ff8a00"/>
  <circle cx="320" cy="230" r="9" fill="none" stroke="#ff8a00" stroke-width="6" opacity="0.4"/>
  <circle cx="320" cy="230" r="3.5" fill="#eaf6ff"/>
</svg>
