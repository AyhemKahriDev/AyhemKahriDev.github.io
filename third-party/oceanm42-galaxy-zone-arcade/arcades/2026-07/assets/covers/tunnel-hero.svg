<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Tunnel Hero cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#ff8a00" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#ff3355" stroke-width="1.5" opacity="0.35"/>

  <!-- depth bands hinted as horizon strata (accent, fading darker) -->
  <g fill="#ff8a00">
    <rect x="24" y="80" width="352" height="52" opacity="0.16"/>
    <rect x="24" y="132" width="352" height="52" opacity="0.11"/>
    <rect x="24" y="184" width="352" height="52" opacity="0.07"/>
    <rect x="24" y="236" width="352" height="40" opacity="0.04"/>
  </g>
  <line x1="24" y1="80" x2="376" y2="80" stroke="#ff8a00" stroke-width="1.5" opacity="0.4"/>

  <!-- carved tunnel: vertical shaft with an elbow -->
  <g fill="#0a0a14" stroke="#ff8a00" stroke-width="2" opacity="0.9">
    <path d="M 175 80 L 225 80 L 225 190 L 305 190 L 305 240 L 175 240 Z" stroke-opacity="0.45"/>
  </g>

  <!-- hero digger in the shaft, pump line extending right -->
  <g>
    <rect x="186" y="200" width="28" height="24" rx="4" fill="#ff8a00"/>
    <rect x="186" y="200" width="28" height="24" rx="4" fill="none" stroke="#ff8a00" stroke-width="5" opacity="0.35"/>
    <path d="M 188 202 a 12 12 0 0 1 24 0 Z" fill="#eaf6ff"/>
    <rect x="203" y="192" width="8" height="6" fill="#ff8a00" opacity="0.9"/>
  </g>
  <line x1="214" y1="212" x2="282" y2="212" stroke="#eaf6ff" stroke-width="3"/>
  <circle cx="284" cy="212" r="4" fill="#eaf6ff"/>

  <!-- inflating pooka at the end of the line: red balloon with goggles -->
  <g>
    <circle cx="316" cy="212" r="26" fill="#ff3355"/>
    <circle cx="316" cy="212" r="26" fill="none" stroke="#ff3355" stroke-width="6" opacity="0.35"/>
    <circle cx="306" cy="206" r="8" fill="#ff8a00"/>
    <circle cx="326" cy="206" r="8" fill="#ff8a00"/>
    <circle cx="306" cy="206" r="3.5" fill="#0a0a14"/>
    <circle cx="326" cy="206" r="3.5" fill="#0a0a14"/>
  </g>

  <!-- rock lodged in dirt above the elbow, ready to drop -->
  <g>
    <circle cx="265" cy="140" r="18" fill="#ff8a00" opacity="0.55"/>
    <circle cx="259" cy="134" r="8" fill="#ff8a00" opacity="0.75"/>
  </g>
</svg>
