<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bug Shooter cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#39ff6a" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.35"/>

  <!-- mushrooms the centipede winds between -->
  <g fill="#00f0ff" opacity="0.5">
    <rect x="94" y="150" width="10" height="16" rx="2"/>
    <path d="M 79 150 a 20 20 0 0 1 40 0 Z"/>
    <rect x="264" y="96" width="10" height="16" rx="2"/>
    <path d="M 249 96 a 20 20 0 0 1 40 0 Z"/>
    <rect x="284" y="206" width="9" height="14" rx="2"/>
    <path d="M 271 206 a 17 17 0 0 1 34 0 Z"/>
    <rect x="120" y="60" width="8" height="12" rx="2"/>
    <path d="M 109 60 a 15 15 0 0 1 30 0 Z"/>
  </g>

  <!-- segmented centipede winding down the field -->
  <g>
    <path d="M 60 60 H 200 V 100 H 140 V 140 H 240 V 180 H 160 V 220 H 300"
          fill="none" stroke="#39ff6a" stroke-width="3" opacity="0.25"/>

    <!-- body segments -->
    <g fill="#39ff6a">
      <circle cx="90" cy="60" r="11"/>
      <circle cx="120" cy="60" r="11"/>
      <circle cx="150" cy="60" r="11"/>
      <circle cx="180" cy="60" r="11"/>
      <circle cx="200" cy="80" r="11"/>
      <circle cx="200" cy="110" r="11"/>
      <circle cx="170" cy="140" r="11"/>
      <circle cx="140" cy="140" r="11"/>
      <circle cx="170" cy="170" r="11"/>
      <circle cx="210" cy="180" r="11"/>
      <circle cx="240" cy="180" r="11"/>
      <circle cx="200" cy="200" r="11"/>
      <circle cx="200" cy="220" r="11"/>
      <circle cx="230" cy="220" r="11"/>
      <circle cx="260" cy="220" r="11"/>
    </g>
    <g stroke="#07070c" stroke-width="1.5" fill="none" opacity="0.5">
      <circle cx="90" cy="60" r="11"/>
      <circle cx="120" cy="60" r="11"/>
      <circle cx="150" cy="60" r="11"/>
      <circle cx="180" cy="60" r="11"/>
      <circle cx="200" cy="80" r="11"/>
      <circle cx="200" cy="110" r="11"/>
      <circle cx="170" cy="140" r="11"/>
      <circle cx="140" cy="140" r="11"/>
      <circle cx="170" cy="170" r="11"/>
      <circle cx="210" cy="180" r="11"/>
      <circle cx="240" cy="180" r="11"/>
      <circle cx="200" cy="200" r="11"/>
      <circle cx="200" cy="220" r="11"/>
      <circle cx="230" cy="220" r="11"/>
      <circle cx="260" cy="220" r="11"/>
    </g>

    <!-- head, bold and glowing -->
    <circle cx="60" cy="60" r="16" fill="#eaf6ff"/>
    <circle cx="60" cy="60" r="16" fill="none" stroke="#39ff6a" stroke-width="4" opacity="0.55"/>
    <circle cx="53" cy="55" r="3" fill="#0a0a14"/>
    <circle cx="67" cy="55" r="3" fill="#0a0a14"/>
  </g>
</svg>
