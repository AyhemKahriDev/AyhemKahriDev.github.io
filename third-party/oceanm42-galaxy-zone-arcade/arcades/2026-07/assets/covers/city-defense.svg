<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="City Defense cover art">
  <rect x="0" y="0" width="400" height="300" fill="#0a0a14"/>

  <!-- neon border frame -->
  <rect x="6" y="6" width="388" height="288" rx="10" fill="none" stroke="#ff3355" stroke-width="2" opacity="0.5"/>
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.35"/>

  <!-- incoming warhead trails -->
  <g stroke="#ff3355" stroke-width="2" opacity="0.55">
    <line x1="60" y1="30" x2="150" y2="150"/>
    <line x1="330" y1="24" x2="255" y2="150"/>
  </g>
  <circle cx="150" cy="150" r="3.5" fill="#ff3355"/>
  <circle cx="255" cy="150" r="3.5" fill="#ff3355"/>

  <!-- expanding blossom (hero shape, centered) -->
  <circle cx="200" cy="176" r="46" fill="#eaf6ff" opacity="0.16"/>
  <circle cx="200" cy="176" r="46" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="200" cy="176" r="26" fill="#eaf6ff" opacity="0.28"/>

  <!-- interceptor trail rising to meet it -->
  <line x1="200" y1="248" x2="200" y2="200" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>

  <!-- ground -->
  <rect x="0" y="248" width="400" height="10" fill="#1a1420"/>

  <!-- cities -->
  <g fill="#ff3355">
    <rect x="66" y="230" width="8" height="18"/>
    <rect x="76" y="222" width="8" height="26"/>
    <rect x="86" y="234" width="8" height="14"/>

    <rect x="306" y="234" width="8" height="14"/>
    <rect x="316" y="222" width="8" height="26"/>
    <rect x="326" y="230" width="8" height="18"/>
  </g>

  <!-- battery domes -->
  <g fill="#00f0ff">
    <path d="M 40 248 A 14 14 0 0 1 68 248 Z"/>
    <path d="M 186 248 A 14 14 0 0 1 214 248 Z"/>
    <path d="M 332 248 A 14 14 0 0 1 360 248 Z"/>
  </g>
</svg>
