      this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate | 0;

      const d = this.noiseBuf.getChannelData(0);

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },

    osc.type = o.type || "square";
    osc.frequency.setValueAtTime(Math.max(1, o.f), t);

  G.upg[u.id] = lvl + 1;

  addPart("plus", G.player.x, G.player.y - 34, u.short + " LV" + (lvl + 1), PAL.yellow);
  track("upgrade_buy", { id: u.id, level: lvl + 1, day: G.day });
}

/* ======================= GAMEPLAY HELPERS =========================== */
function spawnInterval() {
  // escalates through the day + each next day starts faster
  return Math.max(CONFIG.SPAWN.floor,
    CONFIG.SPAWN.start *
    Math.pow(CONFIG.SPAWN.factor, G.dayT / CONFIG.SPAWN.every) *
    Math.pow(CONFIG.SPAWN.dayMul, G.day - 1));
}
function spawnInvoice(station) {
  const st = station || (Math.random() < 0.5 ? "s1" : "s2");
  G[st].q.push({ born: G.runT });
  if (st === "s1") A.sDing(); else A.sChirp();
  addPart("paperPuff", st === "s1" ? 36 : 192 + Math.random() * 60, st === "s1" ? 84 : 32);
}
function agedCount() {
  let n = 0;
  const cut = G.runT - CONFIG.STRESS.agedAfter;
  for (const it of G.s1.q) if (it.born < cut) n++;
  for (const it of G.s2.q) if (it.born < cut) n++;
  return Math.min(n, CONFIG.STRESS.agedMaxCount);
}
function overCapCount() {
  let n = 0;
  if (G.s1.q.length > CONFIG.CAPS.inbox) n++;
  if (G.s2.q.length > CONFIG.CAPS.efakt) n++;
  if (G.s4.q > CONFIG.CAPS.zoe) n++;
  if (G.desk.reports > CONFIG.CAPS.reports) n++;
  return n;
}
function stressTier() { return (G.stress >= 40 ? 1 : 0) + (G.stress >= 70 ? 1 : 0) + (G.chaos ? 1 : 0); }

function addToast(text, dur = 4) { G.toasts.push({ text, t: 0, dur }); }
function addPart(type, x, y, text, col) {
  if (G.parts.length > 80) G.parts.shift();
  G.parts.push({ type, x, y, text, col, t: 0, vx: rand(-20, 20), vy: rand(-60, -22) });
}
function paperBurst(x, y, n) { for (let i = 0; i < n; i++) addPart("paper", x + rand(-9, 9), y + rand(-9, 9)); }

/* Where to go now? (arrows above stations; both inboxes may glow at once) */
function flowTargets() {
  if (G.player.floppy) return ["s4"];
  if (G.s3.floppies > 0 && G.player.pages === 0) return ["s3"];
  if (G.player.pages > 0) return ["s3"];
  if (G.desk.reports > 0) return ["desk"];
  const t = [];
  if (G.s1.q.length) t.push("s1");
  if (G.s2.q.length) t.push("s2");
  return t;
}

/* ===================== CONTEXT ACTION (SPACE) ======================== */
function nearStation() {
  let best = null, bestD = 1e9;
  for (const id in ST) {
    const s = ST[id];
    const d = dist2(G.player.x, G.player.y, s.hx, s.hy);
    if (d < s.r * s.r && d < bestD) { best = id; bestD = d; }
  }
  return best;
}
function currentAction() {
  const p = G.player, at = nearStation();
  if (!at) return null;
  const T = CONFIG.TIMES, H = STRINGS.hints;
  if (at === "s1" || at === "s2") {
    const q = G[at].q;
    if (q.length === 0) return { id: at + "-idle", hint: H.printEmpty };
    if (p.pages >= maxPagesEff()) return { id: at + "-full", hint: H.printFull };
    return { id: at + "-print", hint: H.print, dur: printTimeEff(), repeat: true,
      done() { G[at].q.shift(); p.pages++; A.sPrinter(); addPart("paperPuff", p.x, p.y - 34); } };
  }
  if (at === "s3") {
    if (G.s3.floppies > 0 && !p.floppy)
      return { id: "s3-take", hint: H.floppy, dur: T.takeFloppy,
        done() { G.s3.floppies--; p.floppy = true; A.sFloppy(); } };
    if (G.s3.floppies > 0 && p.floppy && p.pages === 0)
      return { id: "s3-busy", hint: H.floppyBusy };
    if (p.pages === 0) return { id: "s3-idle", hint: H.typeEmpty };
    if (lvlOf("macro") >= 2 && p.pages > 1)
      return { id: "s3-typeall", hint: H.typeAll, dur: T.typeAllBase + T.typeAllPer * p.pages,
        done() { const n = p.pages; for (let i = 0; i < n; i++) typeOne(); A.sEject(); } };
    return { id: "s3-type", hint: H.type, dur: typeTimeEff(), repeat: true,
      done() { typeOne(); } };
  }
  if (at === "s4") {
    if (!p.floppy) return { id: "s4-idle", hint: H.zoeIdle };
    return { id: "s4-give", hint: H.zoe, dur: T.giveFloppy,
      done() { p.floppy = false; G.s4.q++; A.sPop(); addPart("plus", 392, 140, STRINGS.zoeThanks); } };
  }
  if (at === "desk") {
    if (G.desk.reports > 0)
      return { id: "desk-stamp", hint: H.stamp, dur: T.stamp, repeat: true,
        done() {
          G.desk.reports--; G.booked++; G.bookedToday++;
          G.respect = clamp(G.respect + CONFIG.RESPECT.perBooked, 0, CONFIG.RESPECT.max);
          A.sStamp(); G.shake = Math.max(G.shake, 0.06);
          addPart("plus", p.x, p.y - 40, STRINGS.plusBooked);
        } };
    return { id: "desk-idle", hint: null };
  }
  if (at === "phone") {
    if (G.phone.ringing)
      return { id: "phone-answer", hint: H.phone, dur: T.answerPress, done() { answerCall(); } };
    return { id: "phone-idle", hint: null };
  }
  if (at === "coffee") {
    // You can always brew — even when full. Over-caffeinating is the whole point:
    // 4 in a row (no other action between) = heart attack. Hint warns when already wired.
    const wired = G.energy >= CONFIG.ENERGY.max - 1;
    return { id: "coffee-brew", hint: wired ? H.coffeeWired : H.coffee, dur: brewTimeEff(), twoPhase: brewPhaseEff(),
      start() { A.sBrew(); },
      done() {
        G.energy = Math.min(CONFIG.ENERGY.max, G.energy + coffeeGainEff());
        G.coffees++; G.coffeeStreak++;
        A.sSlurp(); addPart("plus", p.x, p.y - 40, "+" + coffeeGainEff());
        if (G.coffeeStreak >= CONFIG.ENERGY.heartAt) return die("heart");
        if (G.coffeeStreak === CONFIG.ENERGY.heartAt - 1) addToast(STRINGS.heartWarning, 3.5);
      } };
  }
  return null;
}
function typeOne() {
  const p = G.player;
  p.pages--; G.typed++; G.s3.count++;
  A.sType(); addPart("plus", 336, 132, STRINGS.plusOne);
  const per = G.mode === "tutorial" ? CONFIG.TUTORIAL.floppyEvery : CONFIG.FLOPPY_EVERY;
  if (G.s3.count >= per) { G.s3.count -= per; G.s3.floppies++; A.sEject(); addToast(STRINGS.hints.floppy, 2.5); }
}

/* ========================= MOVEMENT AND ACTIONS ================================= */
function updatePlayer(dt) {
  const p = G.player;
  if (p.rooted > 0) { p.rooted -= dt; p.moving = false; p.sprinting = false; return; }
  let dx = 0, dy = 0;
  if (input.keys["arrowleft"] || input.keys["a"]) dx--;
  if (input.keys["arrowright"] || input.keys["d"]) dx++;
  if (input.keys["arrowup"] || input.keys["w"]) dy--;
  if (input.keys["arrowdown"] || input.keys["s"]) dy++;
  p.moving = !!(dx || dy);
  p.sprinting = p.moving && !!input.keys["shift"];
  if (!p.moving) return;
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  let sp = CONFIG.PLAYER.speed;
  if (G.mode === "run" && G.energy < CONFIG.ENERGY.lowAt) sp *= CONFIG.PLAYER.slowMult;
  if (p.sprinting) sp *= CONFIG.PLAYER.sprintMult;
  const nx = p.x + dx * sp * dt, ny = p.y + dy * sp * dt;
  const half = 8, foot = 5;
  const ox = p.x, oy = p.y;
  if (!isSolid(nx - half, p.y - foot) && !isSolid(nx + half, p.y - foot) &&
      !isSolid(nx - half, p.y + foot) && !isSolid(nx + half, p.y + foot)) p.x = nx;
  if (!isSolid(p.x - half, ny - foot) && !isSolid(p.x + half, ny - foot) &&
      !isSolid(p.x - half, ny + foot) && !isSolid(p.x + half, ny + foot)) p.y = ny;
  const moved = Math.hypot(p.x - ox, p.y - oy); // actual movement, not intent
  G.walked += moved;
  if (p.pages > 0 || p.floppy) G.walkedCarry += moved;
  p.animT += dt * (p.sprinting ? 1.6 : 1);
  if (p.sprinting && moved > 0) {
    p.puffT = (p.puffT || 0) + dt;
    if (p.puffT > 0.14) { p.puffT = 0; addPart("paperPuff", p.x - Math.sign(p.x - ox) * 8, p.y); }
  }
  if (Math.abs(dx) > Math.abs(dy)) p.dir = dx < 0 ? "left" : "right";
  else p.dir = dy < 0 ? "up" : "down";
}

function updateAction(dt) {
  const act = currentAction();
  const cur = G.action;
  const actId = act && act.dur ? act.id : null;
  if (cur.id !== actId) { cur.id = actId; cur.prog = 0; cur.started = false; }
  G.hintAct = act;
  if (!actId) return;
  if (input.keys[" "] && G.player.rooted <= 0) {
    if (!cur.started) { cur.started = true; if (act.start) act.start(); }
    cur.prog += dt;
    if (cur.prog >= act.dur) {
      act.done();
      if (act.id !== "coffee-brew") G.coffeeStreak = 0; // any other action breaks the coffee streak
      cur.prog = 0; cur.started = false;
      const again = currentAction();
      if (!(act.repeat && again && again.id === actId)) { cur.id = null; }
      G.hintAct = again;
    }
  } else {
    cur.prog = 0; cur.started = false;
  }
}

/* ========================= PHONE (Y/N choices) ========================= */
function respectGapMul() {
  const R = CONFIG.RESPECT;
  return lerp(R.callGapMulAtZero, R.callGapMulAtMax, clamp(G.respect, 0, R.max) / R.max);
}
function scheduleNextCall() {
  G.phone.nextAt = G.runT + rand(CONFIG.PHONE.min, CONFIG.PHONE.max) * respectGapMul();
}
function answerCall() {
  const ph = G.phone;
  ph.ringing = false;
  G.phoneAnswered = true;
  const pool = (G.mode === "run" && G.runT > CONFIG.CHAD_AFTER) ? PHONE_QA.chad : PHONE_QA.client;
  let qa = pick(pool); // no repeating the same question twice in a row
  if (pool.length > 1 && qa === ph.lastQA) qa = pool[(pool.indexOf(qa) + 1) % pool.length];
  ph.lastQA = qa;
  ph.call = { qa, phase: "ask", t: 0, chosen: null };
}
function applyFx(fx) {
  let row = 0;
  const label = (tplS, v, col) => {
    const txt = tplS.replace("{n}", (v > 0 ? "+" : "") + v);
    addPart("plus", G.player.x, G.player.y - 42 - row * 11, txt, col);
    row++;
  };
  if (fx.stress) {
    G.stress = clamp(G.stress + fx.stress, 0, CONFIG.STRESS.max);
    label(STRINGS.fx.stress, fx.stress, fx.stress > 0 ? PAL.red : PAL.green);
  }
  if (fx.respect) {
    G.respect = clamp(G.respect + fx.respect, 0, CONFIG.RESPECT.max);
    label(STRINGS.fx.respect, fx.respect, fx.respect > 0 ? PAL.green : PAL.red);
  }
  if (fx.energy) {
    G.energy = clamp(G.energy + fx.energy, 0, CONFIG.ENERGY.max);
    label(STRINGS.fx.energy, fx.energy, fx.energy > 0 ? PAL.green : PAL.red);
  }
  if (fx.invoices) {
    for (let i = 0; i < fx.invoices; i++) G.burst.push(rand(0.3, 2.2));
    label(STRINGS.fx.invoices.replace("+{n}", "{n}"), fx.invoices, PAL.amber);
  }
}
function chooseAnswer(isYes) {
  const c = G.phone.call;
  if (!c || c.phase !== "ask") return;
  c.chosen = isYes;
  const opt = isYes ? c.qa.yes : c.qa.no;
  applyFx(opt.fx);
  if ((opt.fx.respect || 0) > 0) A.sChime(); else A.sBuzz();
  c.phase = "result"; c.t = 0;
}
function timeoutAnswer() {
  const c = G.phone.call;
  if (!c || c.phase !== "ask") return;
  c.chosen = null;
  applyFx(PHONE_QA.timeout.fx);
  A.sBuzz();
  c.phase = "result"; c.t = 0;
}
function updatePhone(dt) {
  const ph = G.phone, p = G.player;
  if (ph.call) {
    const c = ph.call;
    p.rooted = Math.max(p.rooted, 0.2);
    c.t += dt;
    if (c.phase === "ask") {
      if (input.just.has("y")) chooseAnswer(true);
      else if (input.just.has("n")) chooseAnswer(false);
      else if (c.t > CONFIG.PHONE.decideWindow) timeoutAnswer();
    } else if (c.t > CONFIG.PHONE.resultDur) {
      ph.call = null; p.rooted = 0;
      if (G.mode === "run") scheduleNextCall();
    }
    return;
  }
  if (G.mode === "run" && !ph.ringing && G.runT >= ph.nextAt) {
    ph.ringing = true; ph.ringT = 0; ph.sfxT = 0;
  }
  if (ph.ringing) {
    ph.ringT += dt;
    ph.sfxT -= dt;
    if (ph.sfxT <= 0) { A.sRing(); ph.sfxT = 2; }
    // in the tutorial the phone rings patiently — no penalty
    if (G.mode === "run" && ph.ringT > phoneWindowEff()) {
      ph.ringing = false;
      G.stress = Math.min(CONFIG.STRESS.max, G.stress + CONFIG.STRESS.missedPhone);
      addToast(tpl(STRINGS.missedCall, CONFIG.STRESS.missedPhone), 3);
      G.shake = Math.max(G.shake, 0.25);
      scheduleNextCall();
    }
  }
}

/* ===================== SPAWNER, EVENTS, ZOE, DAY ====================== */
function updateSpawner(dt) {
  if (G.mode !== "run") return;
  G.spawnT += dt;
  const iv = spawnInterval();
  while (G.spawnT >= iv) { G.spawnT -= iv; spawnInvoice(); }
  for (let i = G.burst.length - 1; i >= 0; i--) {
    G.burst[i] -= dt;
    if (G.burst[i] <= 0) { G.burst.splice(i, 1); spawnInvoice(); }
  }
  for (const ev of CONFIG.EVENTS) {
    if (!G.evFired[ev.key] && G.runT >= ev.at) {
      G.evFired[ev.key] = true;
      addToast(STRINGS.events[ev.key], 4.5);
      A.sEvent();
      G.shake = Math.max(G.shake, 0.4);
      for (let i = 0; i < ev.burst; i++) G.burst.push(rand(0.1, 2.5));
      if (ev.chaos) G.chaos = true;
    }
  }
}

function updateZoe(dt) {
  if (G.s4.q > 0) {
    G.s4.t += dt;
    if (G.s4.t >= zoeTimeEff()) {
      G.s4.t = 0; G.s4.q--;
      const n = G.mode === "tutorial" ? CONFIG.TUTORIAL.floppyEvery : CONFIG.REPORTS_PER_FLOPPY;
      G.desk.reports += n;
      A.sChime();
      addPart("plus", 240, 226, "+" + n);
    }
  } else G.s4.t = 0;
}

function updateMeters(dt) {
  if (G.mode !== "run") return;
  const drainMult = G.player.sprinting ? CONFIG.PLAYER.sprintDrainMult : 1;
  G.energy -= CONFIG.ENERGY.drain * drainMult * dt;
  if (G.energy <= 0) { G.energy = 0; return die("energy"); }
  const over = overCapCount(), aged = agedCount();
  const lowRespect = G.respect < CONFIG.RESPECT.lowAt;
  let dS = over * CONFIG.STRESS.overCapPerSec + aged * CONFIG.STRESS.agedPerSec;
  if (lowRespect) dS += CONFIG.RESPECT.lowStressPerSec;
  if (over === 0 && aged === 0 && !G.phone.ringing && !lowRespect) dS -= CONFIG.STRESS.decay;
  G.stress = clamp(G.stress + dS * dt, 0, CONFIG.STRESS.max);
  if (G.stress >= CONFIG.STRESS.max) return die("stress");
}

/* — end of day / morning — */
function enterDayEnd() {
  G.state = "DAYEND";
  G.dayEndT = 0;
  G.phone.ringing = false;
  A.sNight();
  track("day_end", { day: G.day, booked: G.bookedToday });
}
function startMorning() {
  G.day++;
  G.dayT = 0; G.bookedToday = 0; G.spawnT = 0;
  G.energy = CONFIG.ENERGY.max;                                   // night = sleep
  G.stress = Math.max(0, G.stress - CONFIG.STRESS.nightRelief);   // ...and a breather
  G.coffeeStreak = 0;                                             // sleep breaks the coffee streak
  G.phone.nextAt = G.runT + rand(CONFIG.PHONE.min, CONFIG.PHONE.max) * CONFIG.PHONE.firstMul;
  const burst = CONFIG.DAY.morningBurstBase + CONFIG.DAY.morningBurstPerDay * G.day;
  for (let i = 0; i < burst; i++) G.burst.push(rand(0.5, 4));
  addToast(STRINGS.morningToast, 3.5);
  G.daycardNext = "run";
  G.daycardText = tpl(STRINGS.dayCard, G.day);
  G.daycardT = CONFIG.UI.daycardDur;
  G.state = "DAYCARD";
  A.sJingle();
}

function die(cause) {
  if (G.state !== "RUN") return;
  G.state = "DYING";
  G.dying = { t: 0, cause, line: pick(STRINGS.causes.lines) };
  G.lastRun = { seconds: Math.floor(G.runT), booked: G.booked, respect: Math.round(G.respect), day: G.day };
  A.sSad();
  G.shake = 0.6;
  paperBurst(G.player.x, G.player.y - 14, 26);
  track("run_end", { seconds: G.lastRun.seconds, booked: G.lastRun.booked, cause, respect: G.lastRun.respect,
    day: G.day, coffees: G.coffees, meters: Math.round(G.walkedCarry / TILE) });
}

/* ============================ PARTICLES ================================ */
function updateParts(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const pt = G.parts[i];
    pt.t += dt;
    if (pt.type === "paper") {
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 180 * dt;
      pt.vx *= (1 - 1.5 * dt);
      if (pt.t > 1.6) G.parts.splice(i, 1);
    } else if (pt.type === "plus") {
      pt.y -= 20 * dt;
      if (pt.t > 1.1) G.parts.splice(i, 1);
    } else {
      pt.y -= 12 * dt;
      if (pt.t > 0.5) G.parts.splice(i, 1);
    }
  }
  for (let i = G.toasts.length - 1; i >= 0; i--) {
    G.toasts[i].t += dt;
    if (G.toasts[i].t > G.toasts[i].dur) G.toasts.splice(i, 1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
}

/* ============================== UPDATE ================================== */
function updateRun(dt) {
  G.runT += dt;
  if (G.mode === "run") {
    G.dayT += dt;
    if (G.dayT >= CONFIG.DAY.length) { updateParts(dt); return enterDayEnd(); }
  }
  updatePlayer(dt);
  updateAction(dt);
  updateSpawner(dt);
  updateZoe(dt);
  updatePhone(dt);
  updateMeters(dt);
  updateParts(dt);
}

    const txt = (act.id === "coffee-brew" && G.action.started)
      ? (G.action.prog < act.twoPhase ? STRINGS.hints.brewing : STRINGS.hints.drinking)
      : act.hint;
    drawBubble(txt, p.x, p.y - 44 - (p.pages > 0 ? p.pages * 2 + 6 : 0));
  }
  if (act && act.dur && G.action.prog > 0 && !G.phone.call) {
    const w = 32, bx = Math.round(p.x - w / 2), by = Math.round(p.y - 42);
    R(bx - 1, by - 1, w + 2, 7, PAL.ink);
    R(bx, by, Math.floor(w * G.action.prog / act.dur), 5, PAL.yellow);
  }
}

/* Badge: NAME n/cap — always visible, blinks red at ≥80%. */
function drawBadge(name, val, x, y, warn, accent) {
  const label = val === null ? name : name + " " + val;
  const w = textW(label) + 8;
  R(x, y, w, 11, "rgba(20,16,24,0.72)");
  R(x, y + 10, w, 1, "rgba(242,237,228,0.25)");
  const col = warn ? (Math.floor(G.t * 6) % 2 ? PAL.red : PAL.paper) : (accent || PAL.paperLo);
  drawText(vctx, label, x + 4, y + 2, 1, col);
}
function drawBadges() {

  drawBadge(S.s2, G.s2.q.length + "/" + CONFIG.CAPS.efakt, 176, 30, G.s2.q.length >= CONFIG.CAPS.efakt * 0.8);
  const per = G.mode === "tutorial" ? CONFIG.TUTORIAL.floppyEvery : CONFIG.FLOPPY_EVERY;
  drawBadge(S.s3, G.s3.count + "/" + per, 270, 112, false); // 270: longer name doesn't overlap ZOE
  drawBadge(S.s4, G.s4.q + "/" + CONFIG.CAPS.zoe, 398, 112, G.s4.q >= CONFIG.CAPS.zoe * 0.8);
  drawBadge(S.desk, G.desk.reports + "/" + CONFIG.CAPS.reports, 216, 230, G.desk.reports >= CONFIG.CAPS.reports * 0.8);
  drawBadge(S.phone, null, 310, 240, G.phone.ringing, G.phone.ringing ? PAL.yellow : undefined);
  // coffee streak: N/3 only while active — blinks when the next coffee = heart attack
  const safe = CONFIG.ENERGY.heartAt - 1;
  drawBadge(S.coffee, G.coffeeStreak > 0 ? G.coffeeStreak + "/" + safe : null, 8, 262, G.coffeeStreak >= safe);
}
function drawChevron(x, y) {
  R(x - 6, y, 5, 3, PAL.yellow); R(x + 2, y, 5, 3, PAL.yellow);
  R(x - 4, y + 3, 5, 3, PAL.yellow); R(x, y + 3, 5, 3, PAL.yellow);
  R(x - 2, y + 6, 5, 3, PAL.yellow);
}

/* Right-column skeleton (title/intro/teaser/conversion): frame, header
   and empty slots — the composition is complete, upgrades appear in-game. */
/* Upgrade panel (right column, 80 px): keys 1-6, levels and progress.
   A slot fills from gray as you approach the NEXT level's price;
   solid yellow = affordable, green = MAX. Squares = owned levels.
   Menu screens draw it too (skipIntroFade skips the run-start fade-in), so the
   right column always carries the real upgrade list. It used to be an empty
   frame there, which read as a black slab once an overlay dimmed the viewport —
   and that missing right-hand mass is what made centred captions look off. */
function drawUpgradePanel(alphaMul = 1, skipIntroFade = false) {
  const alpha = (skipIntroFade ? 1 : clamp((G.t - G.barShownAt) / 0.6, 0, 1)) * alphaMul;
  if (alpha <= 0) return;
  vctx.globalAlpha = alpha;
  R(MW, HUDH, VW - MW, VH - HUDH, PAL.night);
  R(MW, HUDH, 1, VH - HUDH, "#3a2f42");
  drawTextC(vctx, STRINGS.shop.title, MW + (VW - MW) / 2, HUDH + 6, 1, "#6d5a7a");
  const x = MW + 2, w = VW - MW - 3;
  UPGRADES.forEach((u, i) => {
    const sy = HUDH + 16 + i * 42, sh = 40;
    const con = u.consumable;
    const lvl = con ? 0 : lvlOf(u.id);
    const next = con || u.levels[lvl];           // consumables have no MAX
    // consumable price rises with each use (costStep)
    const price = con ? con.cost + (con.costStep || 0) * G.wellbeings : (next ? next.cost : 0);
    const frac = next ? clamp((G.respect - CONFIG.SHOP.minRespectLeft) / price, 0, 1) : 1;
    const ready = !!next && frac >= 1, maxed = !next;
    R(x, sy, w, sh, "#221a2c");
    if (frac > 0)
      R(x + 1, sy + 1, Math.max(1, Math.floor((w - 2) * frac)), sh - 2,
        maxed ? PAL.plant : (ready ? PAL.yellow : "#3f3950"));
    R(x + 2, sy + 2, 9, 9, PAL.ink);                        // key [1-7]
    drawText(vctx, String(i + 1), x + 4, sy + 3, 1, ready ? PAL.yellow : PAL.paperLo);
    const txtCol = (ready || maxed) ? PAL.ink : PAL.paperLo;
    drawText(vctx, u.short, x + 12, sy + 3, 1, txtCol);
    // what the next level gives (at max: what you own)
    const tip = con ? con.tip : (next ? next.tip : u.levels[u.levels.length - 1].tip);
    drawText(vctx, tip, x + 12, sy + 14, 1, (ready || maxed) ? PAL.ink : "#8d7a9a");
    // slot bottom: level squares (or use counter) + price / MAX
    if (con) {
      if (G.wellbeings > 0) drawText(vctx, "×" + G.wellbeings, x + 12, sy + 27, 1, txtCol);
    } else {
      u.levels.forEach((L, li) => {
        const bx = x + 12 + li * 11, by = sy + 27;
        R(bx, by, 8, 8, PAL.ink);
        if (li < lvl) R(bx + 1, by + 1, 6, 6, maxed ? "#2e5c38" : PAL.green);
      });
    }
    const tag = next ? price + "R" : STRINGS.shop.max;
    drawText(vctx, tag, x + w - 3 - textW(tag), sy + 27, 1, txtCol);
  });
  vctx.globalAlpha = 1;
}

function drawBubble(txt, cx, cy) {
  const lines = wrapText(txt, 180);
  const bw = Math.max(...lines.map(l => textW(l))) + 10, bh = lines.length * LINE_H + 6;
  const bx = Math.round(clamp(cx - bw / 2, 2, MW - bw - 2)), by = Math.round(clamp(cy - bh, HUDH + 2, VH - bh));
  R(bx, by, bw, bh, "rgba(20,16,24,0.88)");
  R(bx, by, bw, 1, PAL.paperLo); R(bx, by + bh - 1, bw, 1, PAL.paperLo);
  R(bx, by, 1, bh, PAL.paperLo); R(bx + bw - 1, by, 1, bh, PAL.paperLo);
  lines.forEach((l, i) => drawText(vctx, l, bx + 5, by + 4 + i * LINE_H, 1, PAL.paper));
}

/* Phone call panel. */
function drawCallPanel() {
  const c = G.phone.call;
  if (!c) return;
  const w = 340, x = Math.round((MW - w) / 2);
  const qLines = wrapText(c.qa.q, w - 20);
  const isAsk = c.phase === "ask";
  const rLines = isAsk ? [] : wrapText(c.chosen === null ? PHONE_QA.timeout.r : (c.chosen ? c.qa.yes.r : c.qa.no.r), w - 20);
  const h = 9 + qLines.length * LINE_H + (isAsk ? 14 : rLines.length * LINE_H) + 8;
  const y = VH - h - (G.mode === "tutorial" ? 56 : 10);
  R(x, y, w, h, "rgba(20,16,24,0.94)");
  R(x, y, w, 1, PAL.yellow); R(x, y + h - 1, w, 1, PAL.yellow);
  R(x, y, 1, h, PAL.yellow); R(x + w - 1, y, 1, h, PAL.yellow);
  qLines.forEach((l, i) => drawTextC(vctx, l, MW / 2, y + 6 + i * LINE_H, 1, PAL.paper));
  const oy = y + 6 + qLines.length * LINE_H + 4;
  if (isAsk) {
    drawText(vctx, STRINGS.keys.yes + c.qa.yes.t, x + 12, oy, 1, PAL.green);
    const noTxt = STRINGS.keys.no + c.qa.no.t;
    drawText(vctx, noTxt, x + w - 12 - textW(noTxt), oy, 1, PAL.red);
    const left = clamp(1 - c.t / CONFIG.PHONE.decideWindow, 0, 1);
    R(x + 1, y + h - 4, Math.floor((w - 2) * left), 3, PAL.amber);
  } else {
    rLines.forEach((l, i) => drawTextC(vctx, l, MW / 2, oy + i * LINE_H, 1, "#bda9cf"));
  }
}

/* ================================ HUD =================================== */
function drawHUD() {
  R(0, 0, VW, HUDH, PAL.night);
  R(0, HUDH - 1, VW, 1, "#3a2f42");
  // clock (position in the day derives from dayT/DAY.length)
  const dispMin = 540 + Math.floor((G.mode === "run" ? G.dayT / CONFIG.DAY.length : 0) * 480);
  const hh = Math.floor(dispMin / 60), mm = String(dispMin % 60).padStart(2, "0");
  drawText(vctx, STRINGS.hud.day + G.day + " " + hh + ":" + mm, 4, 9, 1, PAL.paper);
  // booked
  iconPage(92, 7);
  drawText(vctx, String(G.booked), 104, 9, 1, PAL.yellow);
  // labeled bars
  const bar = (x, label, frac, col, icon) => {
    drawText(vctx, label, x, 2, 1, "#6d5a7a");
    R(x, 13, 70, 8, "#3a2f42");
    R(x + 1, 14, Math.floor(68 * clamp(frac, 0, 1)), 6, col);
    if (icon) icon();
  };
  bar(140, STRINGS.hud.stress, G.stress / CONFIG.STRESS.max,
      G.stress >= 70 ? PAL.red : G.stress >= 40 ? PAL.amber : PAL.green);
  const lowE = G.energy < CONFIG.ENERGY.lowAt && Math.floor(G.t * 4) % 2 === 0;
  bar(225, STRINGS.hud.energy, G.energy / CONFIG.ENERGY.max,
      G.energy < CONFIG.ENERGY.lowAt ? PAL.red : PAL.amber,
      () => { if (!lowE) iconCup(212, 12); });
  const lowR = G.respect < CONFIG.RESPECT.lowAt && Math.floor(G.t * 4) % 2 === 0;
  bar(318, STRINGS.hud.respect, G.respect / CONFIG.RESPECT.max,
      G.respect < CONFIG.RESPECT.lowAt ? PAL.red : G.respect < 50 ? PAL.amber : PAL.green,
      () => { if (!lowR) iconRocket(304, 7, G.respect < CONFIG.RESPECT.lowAt ? PAL.red : undefined); });
  // carried items
  let cx = 402;
  if (G.player.pages > 0) { iconPage(cx, 7); drawText(vctx, "×" + G.player.pages, cx + 10, 9, 1, PAL.paper); cx += 30; }
  if (G.player.floppy) iconFloppy(cx, 7);
  // mute
  const mtxt = A.muted ? STRINGS.hud.muteOff : STRINGS.hud.mute;
  drawText(vctx, mtxt, VW - textW(mtxt) - 4, 9, 1, A.muted ? PAL.red : "#6d5a7a");
}

function drawToasts() {
  let ty = HUDH + 24; // below the E-INVOFAK badge
  for (const t of G.toasts) {
    const a = t.t < 0.25 ? t.t / 0.25 : (t.dur - t.t < 0.4 ? (t.dur - t.t) / 0.4 : 1);
    const w = textW(t.text) + 16;
    const x = Math.round(MW / 2 - w / 2);
    vctx.globalAlpha = clamp(a, 0, 1);
    R(x, ty, w, 15, PAL.ink); R(x, ty, w, 1, PAL.yellow); R(x, ty + 14, w, 1, PAL.yellow);
    drawText(vctx, t.text, x + 8, ty + 4, 1, PAL.yellow);
    vctx.globalAlpha = 1;
    ty += 19;
  }
}

/* ======================= STATE SCREENS ================================== */
function drawTitle() {
  drawWorld();
  drawUpgradePanel(1, true);
  R(0, 0, VW, VH, "rgba(20,16,24,0.72)");
  drawTextC(vctx, STRINGS.title.split(" ")[0], VW / 2, 42, 4, PAL.yellow);

function drawIntro() {

function drawDaycard(text) {
  R(0, 0, VW, VH, PAL.night);
  drawTextC(vctx, text, VW / 2, VH / 2 - 10, 2, PAL.paper);
}

/* End of day: night screen with a summary. */
function drawDayEnd() {
  R(0, 0, VW, VH, "#100e1c");
  for (let i = 0; i < 40; i++) { // stars (deterministic)
    const sx = (i * 97 + G.day * 31) % VW, sy = (i * 53) % 120;
    R(sx, sy, 1, 1, i % 3 ? "#8d7a9a" : "#f2ede4");
  }

  drawTextC(vctx, tpl(STRINGS.dayEnd.title, G.day), VW / 2, 96, 2, PAL.yellow);
  drawTextC(vctx, tpl(STRINGS.dayEnd.booked, G.bookedToday), VW / 2, 136, 1, PAL.paper);
  drawTextC(vctx, tpl(STRINGS.dayEnd.left, G.s1.q.length + G.s2.q.length), VW / 2, 152, 1, PAL.paper);
  drawTextC(vctx, STRINGS.dayEnd.flavor, VW / 2, 176, 1, "#8d7a9a");
  if (Math.floor(G.t * 2) % 2 === 0)
    drawTextC(vctx, STRINGS.dayEnd.next, VW / 2, 216, 1, PAL.green);
}

function drawTutorialOverlay() {
  const step = TUT_STEPS[G.tut.step];
  if (!step) return;
  // the final banner ("YOUR SHIFT STARTS NOW") fades out smoothly instead of popping off
  if (step.id === "done") vctx.globalAlpha = clamp(G.tut.bannerT / 0.8, 0, 1);
  const lines = wrapText(step.text, MW - 90);
  const bh = lines.length * LINE_H + (step.sub ? 12 : 0) + 12;
  const by = VH - bh - 6;
  R(30, by, MW - 60, bh, "rgba(20,16,24,0.92)");
  R(30, by, MW - 60, 1, PAL.yellow); R(30, by + bh - 1, MW - 60, 1, PAL.yellow);
  lines.forEach((l, i) => drawTextC(vctx, l, MW / 2, by + 6 + i * LINE_H, 1, PAL.paper));
  if (step.sub) drawTextC(vctx, step.sub, MW / 2, by + 6 + lines.length * LINE_H + 3, 1, "#8d7a9a");
  if (step.target) {
    const s = ST[step.target];
    const bob = Math.sin(G.t * 6) * 4;
    const ax = s.hx, ay = (s.cy !== undefined ? s.cy : s.hy - 50) + bob;
    R(ax - 2, ay, 4, 9, PAL.yellow);
    R(ax - 6, ay + 9, 12, 3, PAL.yellow);
    R(ax - 4, ay + 12, 8, 3, PAL.yellow);
    R(ax - 2, ay + 15, 4, 2, PAL.yellow);
  }
  vctx.globalAlpha = 1;
}

function drawDying() {
  drawWorld();
  const d = G.dying;
  // HUD and panel fade out with the scene instead of vanishing in a single frame
  const uiA = clamp(1 - d.t / 0.6, 0, 1);
  if (uiA > 0) {
    vctx.globalAlpha = uiA;
    drawHUD();
    vctx.globalAlpha = 1;
    drawUpgradePanel(uiA);
  }
  vctx.globalAlpha = Math.min(0.75, d.t * 0.6);
  R(0, 0, VW, VH, PAL.night);
  vctx.globalAlpha = 1;
  if (d.t > 0.5) {
    drawTextC(vctx, STRINGS.gameOverTitle, VW / 2, 100, 3, PAL.red);
    const causeTxt = d.cause === "stress" ? STRINGS.causes.stress
                   : d.cause === "heart"  ? STRINGS.causes.heart : STRINGS.causes.energy;
    drawTextC(vctx, causeTxt, VW / 2, 142, 1, PAL.paper);
  }
  if (d.t > 1.1) drawTextC(vctx, d.line, VW / 2, 160, 1, "#bda9cf");
}

function drawPausedOverlay() {
  R(0, 0, VW, VH, "rgba(20,16,24,0.7)");
  drawTextC(vctx, STRINGS.paused, VW / 2, VH / 2 - 18, 2, PAL.paper);
  drawTextC(vctx, STRINGS.pausedSub, VW / 2, VH / 2 + 8, 1, "#8d7a9a");
}

function drawTeaser() {
  drawWorld();
  drawUpgradePanel(1, true);
  R(0, 0, VW, VH, "rgba(20,16,24,0.72)");
  drawTextC(vctx, "🧾", VW / 2, VH / 2 - 60, 1, PAL.paper); // (emoji not in font; harmless)
  drawTextC(vctx, STRINGS.teaser.h1, VW / 2, VH / 2 - 8, 2, PAL.yellow);
  drawTextC(vctx, STRINGS.teaser.sub, VW / 2, VH / 2 + 18, 1, "#bda9cf");
}

/* Game-over screen on the canvas: stats grid + [R] PLAY AGAIN. No data capture. */
function drawConversion() {
  drawWorld();
  drawUpgradePanel(1, true);
  R(0, 0, VW, VH, "rgba(20,16,24,0.82)");
  const cx = VW / 2;
  drawTextC(vctx, STRINGS.gameOverTitle, cx, 40, 3, PAL.red);
  drawTextC(vctx, G.dying.line, cx, 78, 1, "#bda9cf");
  const S = STRINGS.conv;
  const rows = [
    [S.statDays, String(G.lastRun.day)],
    [S.statTime, fmtTime(G.lastRun.seconds)],
    [S.statBooked, String(G.lastRun.booked)],
    [S.statCoffee, String(G.coffees)],
    [S.statMeters, String(Math.round(G.walkedCarry / TILE))],
    [S.statRespect, G.lastRun.respect + "%"],
  ];
  // 2 columns × 3 rows of stat cells
  const cellW = 150, cellH = 34, gap = 8, cols = 2;
  const gridW = cols * cellW + gap, x0 = Math.round(cx - gridW / 2), y0 = 100;
  rows.forEach(([label, val], i) => {
    const cxCell = x0 + (i % cols) * (cellW + gap);
    const cyCell = y0 + Math.floor(i / cols) * (cellH + gap);
    R(cxCell, cyCell, cellW, cellH, "#141018");
    R(cxCell, cyCell, cellW, 1, "#6d5a7a"); R(cxCell, cyCell + cellH - 1, cellW, 1, "#6d5a7a");
    R(cxCell, cyCell, 1, cellH, "#6d5a7a"); R(cxCell + cellW - 1, cyCell, 1, cellH, "#6d5a7a");
    drawText(vctx, val, cxCell + 8, cyCell + 7, 2, PAL.yellow);
    drawText(vctx, label, cxCell + 8, cyCell + 24, 1, "#bda9cf");
  });
  drawTextC(vctx, S.kicker, cx, y0 + 3 * (cellH + gap) + 6, 1, "#8d7a9a");
  if (Math.floor(G.t * 2) % 2 === 0)
    drawTextC(vctx, S.again, cx, VH - 22, 1, PAL.green);
}

/* ============================ MAIN DRAW =============================== */
function draw() {
  vctx.fillStyle = PAL.night; vctx.fillRect(0, 0, VW, VH);
  switch (G.state) {
    case "TITLE":   drawTitle(); break;
    case "INTRO":   drawIntro(); drawHUD(); break;
    case "DAYCARD": drawDaycard(G.daycardText || tpl(STRINGS.dayCard, G.day)); break;
    case "DAYEND":  drawDayEnd(); break;
    case "TEASER":  drawTeaser(); break;
    case "TUTORIAL":
    case "RUN":
      drawWorld(); drawHUD(); drawToasts();
      drawUpgradePanel();
      if (G.mode === "tutorial") drawTutorialOverlay();
      if (G.stress > CONFIG.UI.vignetteFrom) {
        vctx.globalAlpha = clamp((G.stress - CONFIG.UI.vignetteFrom) / (CONFIG.STRESS.max - CONFIG.UI.vignetteFrom), 0, 1) * 0.8;
        vctx.drawImage(vignette, 0, 0);
        vctx.globalAlpha = 1;
      }
      if ((G.chaos || G.stress >= 70) && Math.random() < 0.05)
        R(0, 0, VW, VH, "rgba(240,240,220,0.08)");
      drawCallPanel();
      if (G.paused) drawPausedOverlay();
      break;
    case "DYING":   drawDying(); break;
    case "CONVERSION": drawConversion(); break;
  }
  const sh = G.shake > 0 ? Math.ceil(G.shake * 8) : 0;
  const ox = sh ? randI(-sh, sh) : 0, oy = sh ? randI(-sh, sh) : 0;
  ctx.fillStyle = PAL.night; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(view, 0, 0, VW, VH, ox * 2, oy * 2, canvas.width, canvas.height);
}

  { id:"floppy", text:STRINGS.tutorial.floppy, target:"s3",
    done(){ return G.player.floppy || G.s4.q > 0 || G.desk.reports > 0; } },
  { id:"zoe",    text:STRINGS.tutorial.zoe, target:"s4",
    done(){ return G.s4.q > 0 || G.desk.reports > 0; } },
  { id:"stamp",  text:STRINGS.tutorial.stamp, target:"desk",
    done(){ return G.booked >= CONFIG.TUTORIAL.floppyEvery; } },
  { id:"phone",  text:STRINGS.tutorial.phone, target:"phone",
    enter(){ G.phone.ringing = true; G.phone.ringT = 0; G.phone.sfxT = 0; },
    done(){ return G.phoneAnswered && !G.phone.call; } },
  { id:"coffee", text:STRINGS.tutorial.coffee, target:"coffee",
    enter(){ G.energy = 25; },
    done(){ return G.energy > 60; } },
  { id:"done",   text:STRINGS.tutorial.done, sub:STRINGS.tutorial.doneSub,
    enter(){ G.tut.bannerT = 2.5; A.sJingle(); },
    done(){ return false; } },
];

function startTutorial() {
  resetRun();
  G.mode = "tutorial";
  G.state = "TUTORIAL";
  G.barShownAt = G.t; // upgrade panel visible (and active) from the start of the tutorial
  G.tut = { step: 0, movedFrom: null, bannerT: 0 };
  for (const s of TUT_STEPS) s.entered = false;
  showSkip(true);
}
function updateTutorial(dt) {
  const s = TUT_STEPS[G.tut.step];
  if (!s) return;
  if (!s.entered) { s.entered = true; if (s.enter) s.enter(); }
  if (s.id === "done") {
    G.tut.bannerT -= dt;
    if (G.tut.bannerT <= 0) finishTutorial(true);
    return;
  }
  if (s.done()) { G.tut.step++; A.sPop(); }
}
function finishTutorial(completed) {
  showSkip(false);
  // SKIP/X during the final banner = tutorial completed anyway (don't wipe purchases/position)
  const s = TUT_STEPS[G.tut.step];
  if (s && s.id === "done") completed = true;
  if (!completed) { startRun(); return; }   // SKIP mid-lesson = fresh shift from scratch
  track("tutorial_complete", {});
  track("game_start", {});
  // Smooth transition: world, position and counters stay — only the shift
  // clock, invoice spawner and phone restart. No teleport, no jump.
  G.mode = "run";
  G.state = "RUN";
  G.runT = 0;                                // events (EVENTS/CHAD_AFTER) count from 9:00
  G.dayT = 0; G.spawnT = 0;
  G.coffeeStreak = 0;                        // tutorial coffee doesn't count toward the streak
  G.burst = [];                              // frozen tutorial-phone "promises" don't dump at 9:00
  G.phone.nextAt = rand(CONFIG.PHONE.min, CONFIG.PHONE.max) * CONFIG.PHONE.firstMul;
}

/* ============================ INTRO / DAYCARD =========================== */
function startIntro() {
  A.init(); A.resume();
  input.capture = true;
  canvas.focus({ preventScroll: true });
  G.state = "INTRO";
  G.intro = { i: 0, chars: 0, ringT: 0 };
  showSkip(true);
}
function advanceIntro() {
  const line = STRINGS.intro[G.intro.i];
  if (!line) return gotoDaycard();
  if (G.intro.chars < line.text.length) { G.intro.chars = line.text.length; return; }
  G.intro.i++; G.intro.chars = 0;
  if (G.intro.i >= STRINGS.intro.length) gotoDaycard();
}
function updateIntro(dt) {
  G.intro.chars += dt * CONFIG.UI.introCps;
  if (G.intro.i === 0) {
    G.intro.ringT -= dt;
    if (G.intro.ringT <= 0) { A.sRing(); G.intro.ringT = 2; }
  }
  if (input.just.has(" ") || input.just.has("enter")) advanceIntro();
}
function gotoDaycard() {
  G.state = "DAYCARD";
  G.daycardT = CONFIG.UI.daycardDur;
  G.daycardText = tpl(STRINGS.dayCard, 1);
  G.daycardNext = "tutorial";
  showSkip(false);
  A.sJingle();
}

/* ========================== GAME OVER → CONVERSION ======================= */
/* No DOM, no data capture. The game-over screen is drawn on the canvas
   (drawConversion); an embedding page may overlay its own popup. */
function showConversion() {
  G.state = "CONVERSION";
}

/* ============================== DOM / UI ================================ */
function showSkip(on) {
  const b = document.getElementById("skipBtn");
  if (on) b.classList.remove("hidden"); else b.classList.add("hidden");
}

function populateDom() {
  const $ = id => document.getElementById(id);
  $("skipBtn").textContent = STRINGS.skip;
  $("skipBtn").addEventListener("click", () => {
    if (G.state === "INTRO") gotoDaycard();
    else if (G.state === "TUTORIAL") finishTutorial(false);
  });
}

/* ============================ TEASER (TOUCH) ============================ */
function startTeaser() {
  G.state = "TEASER";
  for (let i = 0; i < 9; i++) G.s1.q.push({ born: 0 });
  for (let i = 0; i < 7; i++) G.s2.q.push({ born: 0 });
  G.desk.reports = 6;
  G.phone.ringing = true;
  G.player.pages = 4;
  track("game_start", { touch: true });
}
function updateTeaser(dt) {
  const p = G.player;
  p.x = 225 + Math.sin(G.t * 0.9) * 128;
  p.y = 180 + Math.sin(G.t * 1.8) * 12;
  p.dir = Math.cos(G.t * 0.9) < 0 ? "left" : "right";
  p.moving = true; p.animT = G.t;
  if (Math.random() < 0.06) addPart("paper", rand(30, MW - 30), rand(HUDH + 10, 130));
  updateParts(dt);
}

/* ============================ MAIN LOOP ============================== */
function update(dt) {
  G.t += dt;
  if (input.just.has("m")) { A.setMuted(!A.muted); }

  // buy upgrade levels with keys 1-6 (in run and tutorial)
  if (!G.paused && (G.state === "RUN" || G.state === "TUTORIAL"))
    for (let i = 0; i < UPGRADES.length; i++)
      if (input.just.has(String(i + 1))) shopBuy(i);

  if ((input.just.has("p") || input.just.has("escape")) && (G.state === "RUN" || G.state === "TUTORIAL")) {
    G.paused = !G.paused; G.pausedByBlur = false;
    if (G.paused) clearKeys();
  }
  if (input.just.has("x") && (G.state === "INTRO" || G.state === "TUTORIAL")) {
    if (G.state === "INTRO") gotoDaycard(); else finishTutorial(false);
  }
  if (input.just.has("r") && G.state === "CONVERSION") startRun();

  switch (G.state) {
    case "TITLE":
      if (input.just.has("enter")) startIntro();
      updateParts(dt);
      break;
    case "INTRO":  updateIntro(dt); break;
    case "DAYCARD":
      G.daycardT -= dt;
      if (G.daycardT <= 0) {
        if (G.daycardNext === "tutorial") startTutorial();
        else G.state = "RUN";
      }
      break;
    case "DAYEND":
      G.dayEndT += dt;
      updateParts(dt);
      if (input.just.has(" ") || input.just.has("enter") || G.dayEndT > CONFIG.DAY.endPause) startMorning();
      break;
    case "TUTORIAL":
      if (!G.paused) { updateRun(dt); updateTutorial(dt); }
      break;
    case "RUN":
      if (!G.paused) updateRun(dt);
      break;
    case "DYING":
      G.dying.t += dt;
      updateParts(dt);
      if (G.dying.t > CONFIG.UI.dyingDelay) showConversion();
      break;
    case "CONVERSION": updateParts(dt); break;
    case "TEASER": updateTeaser(dt); break;
  }
  if (!G.paused && G.state !== "TEASER") A.musicUpdate(stressTier());
}

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  update(dt);
  draw();
  input.just.clear();
}

/* ========================= INPUT EVENTS ============================ */
canvas.addEventListener("click", e => {
  if (G.state === "TEASER") return;
  A.init(); A.resume();
  canvas.focus({ preventScroll: true });
  if (G.state === "TITLE") { startIntro(); return; }
  if (G.state === "INTRO") { advanceIntro(); return; }
  if ((G.state === "RUN" || G.state === "TUTORIAL") && G.paused) { G.paused = false; G.pausedByBlur = false; }
});
window.addEventListener("blur", () => {
  if (G.state === "RUN" || G.state === "TUTORIAL") { G.paused = true; G.pausedByBlur = true; }
  clearKeys();
});
/* Commands from the player (parent page) in embed mode. */
window.addEventListener("message", e => {
  const d = e && e.data;
  if (!EMBED || !d || d.source !== "hm-player") return;
  if (d.cmd === "restart" && (G.state === "CONVERSION" || G.state === "DYING")) startRun();
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && (G.state === "RUN" || G.state === "TUTORIAL")) {
    G.paused = true; G.pausedByBlur = true; clearKeys();
  }
});

/* ================================ BOOT ================================== */
function boot() {
  prerenderMap();
  prerenderVignette();
  populateDom();
  const touchOnly = (() => {
    try {
      return window.matchMedia && window.matchMedia("(pointer: coarse)").matches &&
             !window.matchMedia("(any-pointer: fine)").matches;
    } catch (e) { return false; }
  })();
  if (touchOnly) startTeaser();
  requestAnimationFrame(frame);
}
boot();

/* QA/debug handle (also used by automated tests). */
window.__HM__ = { G, CONFIG, STRINGS, PHONE_QA, UPGRADES, FONT, A, input, ST, shopBuy,
  startIntro, startTutorial, startRun, finishTutorial, gotoDaycard, advanceIntro,
  showConversion, startMorning, enterDayEnd, die, update, draw,
  isEmbed: () => EMBED, setEmbed: v => { EMBED = !!v; } };
</script>
</body>
</html>
