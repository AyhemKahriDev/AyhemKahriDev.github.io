<!DOCTYPE html>
<html lang="en">
<head>
<title>BATTLE CITY</title>
<link rel='icon' href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎮</text></svg>'/>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="js/jquery.min.js"></script>
<script src="js/Helper.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/const.js"></script>
<script src="js/level.js"></script>
<script src="js/crackAnimation.js"></script>
<script src="js/prop.js"></script>
<script src="js/bullet.js"></script>
<script src="js/tank.js"></script>
<script src="js/num.js"></script>
<script src="js/menu.js"></script>
<script src="js/map.js"></script>
<script src="js/Collision.js"></script>
<script src="js/stage.js"></script>
<script src="js/main.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    padding: 24px 16px;
  }

  /* ── Title ── */
  .game-title {
    font-size: 22px;
    letter-spacing: 6px;
    color: #f5c518;
    text-shadow:
      0 0 8px #f5c518,
      0 0 24px rgba(245,197,24,0.4);
    margin-bottom: 18px;
    user-select: none;
  }

  /* ── Outer cabinet shell ── */
  .cabinet {
    background: #141414;
    border: 2px solid #2a2a2a;
    border-radius: 6px;
    padding: 20px;
    box-shadow:
      0 0 0 1px #1f1f1f,
      0 8px 40px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ── Controls bar ── */
  .controls-bar {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .ctrl-label {
    font-size: 6px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .ctrl-keys {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .key {
    background: #1e1e1e;
    border: 1px solid #383838;
    border-bottom: 3px solid #282828;
    border-radius: 4px;
    color: #f5c518;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 5px 7px;
    min-width: 26px;
    text-align: center;
    line-height: 1;
    user-select: none;
  }

  .key.wide  { min-width: 54px; }
  .key.shoot { color: #ff5555; border-color: #4a2222; border-bottom-color: #3a1a1a; }

  .ctrl-sep {
    width: 1px;
    height: 36px;
    background: #2a2a2a;
    align-self: center;
  }

  /* ── Canvas wrapper ── */
  .canvas-shell {
    position: relative;
    border: 2px solid #2a2a2a;
    border-radius: 2px;
    box-shadow:
      0 0 0 1px #1a1a1a,
      inset 0 0 30px rgba(0,0,0,0.5);
    /* scanline overlay */
    background: #000;
  }

  .canvas-shell::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    border-radius: 2px;
    z-index: 10;
  }

  #canvasDiv {
    position: relative;
    width: 512px;
    height: 448px;
    display: block;
  }

  #canvasDiv canvas {
    position: absolute;
    top: 0;
    left: 0;
  }

  /* ── Bottom hint ── */
  .hint-bar {
    font-size: 5.5px;
    color: #3a3a3a;
    letter-spacing: 2px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="game-title">BATTLE CITY</div>

<div class="cabinet">

  <!-- Controls hint -->
  <div class="controls-bar">
    <div class="ctrl-group">
      <span class="ctrl-label">Player 1</span>
      <div class="ctrl-keys">
        <span class="key">W</span>
        <span class="key">A</span>
        <span class="key">S</span>
        <span class="key">D</span>
        <span class="key wide shoot">SPACE</span>
      </div>
    </div>

    <div class="ctrl-sep"></div>

    <div class="ctrl-group">
      <span class="ctrl-label">Player 2</span>
      <div class="ctrl-keys">
        <span class="key">↑</span>
        <span class="key">←</span>
        <span class="key">↓</span>
        <span class="key">→</span>
        <span class="key wide shoot">ENTER</span>
      </div>
    </div>
  </div>

  <!-- Game canvas -->
  <div class="canvas-shell">
    <div id="canvasDiv">
      <canvas id="wallCanvas"></canvas>
      <canvas id="tankCanvas"></canvas>
      <canvas id="grassCanvas"></canvas>
      <canvas id="overCanvas"></canvas>
      <canvas id="stageCanvas"></canvas>
    </div>
  </div>

  <div class="hint-bar">PRESS ENTER TO START &nbsp;·&nbsp; N / P TO SKIP LEVELS</div>

</div>

</body>
</html>
