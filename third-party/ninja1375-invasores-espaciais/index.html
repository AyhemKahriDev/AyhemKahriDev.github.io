<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Jogo Invasores Espaciais - Reviva o clássico game de arcade">
    <meta name="keywords" content="jogo, invasores espaciais, arcade, javascript, canvas">
    <link rel="stylesheet" href="style.css">
    <title>Invasores Espaciais - Jogo Clássico</title>
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Invasores Espaciais</h1>
            <div class="score-board">
                <div class="score-item">
                    <span class="label">Pontuação:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Vidas:</span>
                    <span id="lives" class="value">3</span>
                </div>
                <div class="score-item">
                    <span class="label">Nível:</span>
                    <span id="level" class="value">1</span>
                </div>
            </div>
        </header>
        
        <main class="game-area">
            <div class="canvas-container">
                <canvas id="gameCanvas">
                    Seu navegador não suporta o elemento canvas.
                </canvas>
                <div id="mobileControls" class="mobile-controls">
                    <div class="control-row">
                        <button id="leftBtn" class="control-btn">←</button>
                        <button id="fireBtn" class="control-btn fire">FOGO</button>
                        <button id="rightBtn" class="control-btn">→</button>
                    </div>
                </div>
            </div>
        </main>
        
        <div class="controls">
            <p class="instructions">Use ← → para mover e Espaço para atirar</p>
            <div class="buttons">
                <button id="startBtn" class="btn">Iniciar Jogo</button>
                <button id="pauseBtn" class="btn">Pausar</button>
            </div>
        </div>
        
        <div id="gameOver" class="game-over hidden">
            <div class="game-over-content">
                <h2>Game Over!</h2>
                <p>Sua pontuação: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="btn">Jogar Novamente</button>
            </div>
        </div>

        <div id="pauseScreen" class="pause-screen hidden">
            <div class="pause-content">
                <h2>Jogo Pausado</h2>
                <button id="resumeBtn" class="btn">Continuar</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
