<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f8f7ef" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>键盘小岛 · 一次按键，一点奇遇</title>
    <link rel="stylesheet" href="style.css?v=4" />
    <link rel="stylesheet" href="playful.css?v=4" />
    <link rel="stylesheet" href="diver.css?v=2" />
    <link rel="stylesheet" href="expansion.css?v=1" />
  </head>
  <body>
    <header>
      <a class="brand" href="#" aria-label="键盘小岛首页"
        ><span class="brand-icon">⌘</span
        ><span>键盘小岛<small>KEYBOARD ISLAND</small></span></a
      >
      <nav aria-label="主导航">
        <button class="nav active" data-page="home">我的小岛</button
        ><button class="nav" data-page="map">冒险地图</button
        ><button class="nav" data-page="collection">伙伴小屋</button
        ><button class="nav" data-page="free">自由音乐会</button>
      </nav>
      <div class="header-actions">
        <span class="shell-count">✦ <b id="shells">0</b> 贝壳</span
        ><button
          class="icon-button"
          id="sound"
          aria-label="关闭音效"
          title="音效"
        >
          ♫</button
        ><button
          class="icon-button"
          id="settings"
          aria-label="家长设置"
          title="家长设置"
        >
          ⚙
        </button>
      </div>
    </header>
    <main id="app"></main>
    <div id="toast" role="status"></div>
    <dialog id="dialog"></dialog>
    <script src="chapters.js?v=7"></script>
    <script src="artwork.js?v=3"></script>
    <script src="expansion-scenes.js?v=1"></script>
    <script src="scenes.js?v=7"></script>
    <script src="sound.js?v=7"></script>
    <script src="voice-clips.js?v=7"></script>
    <script src="voice.js?v=5"></script>
    <script src="face-camera.js?v=1"></script>
    <script src="room.js?v=1"></script>
    <script src="diver.js?v=2"></script>
    <script src="app.js?v=7"></script>
  </body>
</html>
