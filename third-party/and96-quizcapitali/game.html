<!DOCTYPE html>
<html lang="it">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Indovina le Capitali</title>
      <!-- Bootstrap 5 CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
      <style>
         :root{
         --md-primary:#7895a2;          /* tonal primary */
         --md-surface:#fafafa;           /* surface */
         --md-outline:#e0e0e0;           /* outline/divider */
         --md-correct:#198754;           /* success */
         --md-wrong:#dc3545;             /* error */
         }
         body{ background:var(--md-surface); font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", "Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol"; }
         .app{ max-width:760px; margin:0 auto; }
         .surface{
         background:#fff; border:1px solid var(--md-outline); border-radius:16px;
         }
         .progress{ height:0px; background:var(--md-outline); border-radius:4px; }
         .progress-bar{ background:var(--md-primary); }
         .flag{ width:200px; max-width:60vw; height:auto; border-radius:8px; border:1px solid var(--md-outline);}
         .answer-btn{ border-radius:12px; border:1px solid var(--md-outline); background:#fff; }
         .answer-btn:hover{ background:#f3f6ff; }
         .answer-btn.correct{ background:var(--md-correct)!important; color:#fff!important; border-color:var(--md-correct)!important; }
         .answer-btn.wrong{ background:var(--md-wrong)!important; color:#fff!important; border-color:var(--md-wrong)!important; }
         .chip{ font-variant-numeric: tabular-nums; }
         .section-title{ font-size:1rem; font-weight:600; margin-top:1rem; }
         .list-result{ font-size:.95rem; padding-left:1.2rem; }
         .btn-flat{ border-radius:12px; }
      </style>
   </head>
   <body>
      <div class="container py-4 app">
         <header class="mb-4 text-center">
            <h1 class="h4 fw-semibold mb-2">Quiz Capitali</h1>
            <p class="text-muted mb-0">Indovina la capitale delle nazioni del mondo</p>
         </header>
         <div class="surface p-3 p-md-4">
            <!-- HUD -->
            <div class="d-flex align-items-center justify-content-between mb-0">
               <div class="flex-grow-1 me-3">
                  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="50">
                     <div id="progressBar" class="progress-bar" style="width:0%"></div>
                  </div>
               </div>
               <div>
                  <span class="badge text-bg-light text-secondary chip" id="counter">0 / 50</span>
                  <span class="badge text-bg-success chip ms-2" id="scoreRight">✔ 0</span>
                  <span class="badge text-bg-danger chip ms-1" id="scoreWrong">✖ 0</span>
               </div>
            </div>
            <!-- Flag + Question -->
            <div class="text-center mb-3">
               <img id="flag" class="flag" src="" alt=""/>
            </div>
            <h2 class="h5 text-center mb-4" id="question">Caricamento…</h2>
            <!-- Answers -->
            <div class="row g-3 mb-3" id="answers"></div>
         </div>
         <!-- Live summary (sempre visibile) -->
         <div id="liveSummary">
            <div class="row mt-3">
               <div class="col-md-6 mb-3">
                  <h3 class="section-title">Corrette <span class="badge text-bg-success chip" id="liveRightCount">0</span></h3>
                  <ol id="listRight" class="list-result mb-0"></ol>
               </div>
               <div class="col-md-6 mb-3">
                  <h3 class="section-title">Errate <span class="badge text-bg-danger chip" id="liveWrongCount">0</span></h3>
                  <ol id="listWrong" class="list-result mb-0"></ol>
               </div>
            </div>
            <div class="text-center mt-2">
               <button id="restartBtn" class="btn btn-primary btn-flat btn-sm" type="button" style="display:none;">Ricomincia</button>
            </div>
         </div>
      </div>
      <script>
         (function(){
           "use strict";
         
           // --- Dati: Top 50 paesi più popolosi (capitale ufficiale) ---
           const COUNTRIES = [
             { country:"India", capital:"Nuova Delhi", code:"in" },
             { country:"Cina", capital:"Pechino", code:"cn" },
             { country:"Stati Uniti", capital:"Washington, D.C.", code:"us" },
             { country:"Indonesia", capital:"Giacarta", code:"id" },
             { country:"Pakistan", capital:"Islamabad", code:"pk" },
             { country:"Nigeria", capital:"Abuja", code:"ng" },
             { country:"Brasile", capital:"Brasilia", code:"br" },
             { country:"Bangladesh", capital:"Dhaka", code:"bd" },
             { country:"Russia", capital:"Mosca", code:"ru" },
             { country:"Messico", capital:"Città del Messico", code:"mx" },
             { country:"Etiopia", capital:"Addis Abeba", code:"et" },
             { country:"Giappone", capital:"Tokyo", code:"jp" },
             { country:"Filippine", capital:"Manila", code:"ph" },
             { country:"Egitto", capital:"Il Cairo", code:"eg" },
             { country:"Vietnam", capital:"Hanoi", code:"vn" },
             { country:"Congo", capital:"Kinshasa", code:"cd" },
             { country:"Iran", capital:"Teheran", code:"ir" },
             { country:"Turchia", capital:"Ankara", code:"tr" },
             { country:"Germania", capital:"Berlino", code:"de" },
             { country:"Thailandia", capital:"Bangkok", code:"th" },
             { country:"Regno Unito", capital:"Londra", code:"gb" },
             { country:"Francia", capital:"Parigi", code:"fr" },
             { country:"Italia", capital:"Roma", code:"it" },
             { country:"Tanzania", capital:"Dodoma", code:"tz" },
             { country:"Sudafrica", capital:"Pretoria", code:"za" },  // esecutiva
             { country:"Kenya", capital:"Nairobi", code:"ke" },
             { country:"Corea del Sud", capital:"Seul", code:"kr" },
             { country:"Colombia", capital:"Bogotá", code:"co" },
             { country:"Spagna", capital:"Madrid", code:"es" },
             { country:"Uganda", capital:"Kampala", code:"ug" },
             { country:"Ucraina", capital:"Kyiv", code:"ua" },
             { country:"Argentina", capital:"Buenos Aires", code:"ar" },
             { country:"Algeria", capital:"Algeri", code:"dz" },
             { country:"Sudan", capital:"Khartum", code:"sd" },
             { country:"Iraq", capital:"Baghdad", code:"iq" },
             { country:"Afghanistan", capital:"Kabul", code:"af" },
             { country:"Polonia", capital:"Varsavia", code:"pl" },
             { country:"Canada", capital:"Ottawa", code:"ca" },
             { country:"Marocco", capital:"Rabat", code:"ma" },
             { country:"Arabia Saudita", capital:"Riad", code:"sa" },
             { country:"Uzbekistan", capital:"Tashkent", code:"uz" },
             { country:"Perù", capital:"Lima", code:"pe" },
             { country:"Malaysia", capital:"Kuala Lumpur", code:"my" },
             { country:"Angola", capital:"Luanda", code:"ao" },
             { country:"Ghana", capital:"Accra", code:"gh" },
             { country:"Mozambico", capital:"Maputo", code:"mz" },
             { country:"Yemen", capital:"Sana\'a", code:"ye" },
             { country:"Nepal", capital:"Kathmandu", code:"np" },
             { country:"Madagascar", capital:"Antananarivo", code:"mg" },
			 { country:"Romania", capital:"Bucarest", code:"ro" },
             { country:"Paesi Bassi", capital:"Amsterdam", code:"nl" },
             { country:"Belgio", capital:"Bruxelles", code:"be" },
             { country:"Grecia", capital:"Atene", code:"gr" },
             { country:"Repubblica Ceca", capital:"Praga", code:"cz" },
             { country:"Portogallo", capital:"Lisbona", code:"pt" },
             { country:"Svezia", capital:"Stoccolma", code:"se" },
             { country:"Ungheria", capital:"Budapest", code:"hu" },
             { country:"Bielorussia", capital:"Minsk", code:"by" },
             { country:"Austria", capital:"Vienna", code:"at" },
             { country:"Svizzera", capital:"Berna", code:"ch" },
             { country:"Bulgaria", capital:"Sofia", code:"bg" },
             { country:"Serbia", capital:"Belgrado", code:"rs" },
             { country:"Danimarca", capital:"Copenaghen", code:"dk" },
             { country:"Finlandia", capital:"Helsinki", code:"fi" },
             { country:"Slovacchia", capital:"Bratislava", code:"sk" },
             { country:"Norvegia", capital:"Oslo", code:"no" },
             { country:"Irlanda", capital:"Dublino", code:"ie" },
             { country:"Croazia", capital:"Zagabria", code:"hr" },
             { country:"Bosnia ed Erzegovina", capital:"Sarajevo", code:"ba" },
             { country:"Moldavia", capital:"Chișinău", code:"md" },
             { country:"Lituania", capital:"Vilnius", code:"lt" },
             { country:"Slovenia", capital:"Lubiana", code:"si" },
             { country:"Lettonia", capital:"Riga", code:"lv" },
             { country:"Estonia", capital:"Tallinn", code:"ee" },
             { country:"Macedonia del Nord", capital:"Skopje", code:"mk" },
             { country:"Albania", capital:"Tirana", code:"al" },
             { country:"Montenegro", capital:"Podgorica", code:"me" },
             { country:"Kosovo", capital:"Pristina", code:"xk" },
             { country:"Lussemburgo", capital:"Lussemburgo", code:"lu" },
             { country:"Islanda", capital:"Reykjavík", code:"is" },
             { country:"Malta", capital:"La Valletta", code:"mt" },
			 { country:"Venezuela", capital:"Caracas", code:"ve" },
             { country:"Ecuador", capital:"Quito", code:"ec" },
			 { country:"Australia", capital:"Canberra", code:"au" },
             { country:"Nuova Zelanda", capital:"Wellington", code:"nz" },
             { country:"Israele", capital:"Gerusalemme", code:"il" },
             { country:"Giordania", capital:"Amman", code:"jo" },
             { country:"Libano", capital:"Beirut", code:"lb" },
             { country:"Siria", capital:"Damasco", code:"sy" },
             { country:"Cuba", capital:"L'Avana", code:"cu" },
             { country:"Cile", capital:"Santiago", code:"cl" },
             { country:"Bolivia", capital:"Sucre / La Paz", code:"bo" },
             { country:"Paraguay", capital:"Asunción", code:"py" },
             { country:"Kazakhstan", capital:"Astana", code:"kz" },
             { country:"Singapore", capital:"Singapore", code:"sg" },
			 { country:"Guatemala", capital:"Città del Guatemala", code:"gt" },
             { country:"Panama", capital:"Panamá", code:"pa" },
             { country:"Costa Rica", capital:"San José", code:"cr" },
			 { country:"Cipro", capital:"Nicosia", code:"cy" },
			 { country:"Giamaica", capital:"Kingston", code:"jm" },
           ];
         
           // --- Utilità ---
           function shuffle(arr){
             const a=arr.slice();
             for(let i=a.length-1;i>0;i--){
               const j=Math.floor(Math.random()*(i+1));
               [a[i],a[j]]=[a[j],a[i]];
             }
             return a;
           }
           function $(id){ return document.getElementById(id); }
           function buildFlagUrl(code){ return `https://flagcdn.com/w320/${code}.png`; }
         
           // --- Elementi ---
           const flagEl = $("flag");
           const questionEl = $("question");
           const answersRow = $("answers");
           const counterEl = $("counter");
           const pbEl = $("progressBar");
           const scoreRightEl = $("scoreRight");
           const scoreWrongEl = $("scoreWrong");
           const listRightEl = $("listRight");
           const listWrongEl = $("listWrong");
           const liveRightCount = $("liveRightCount");
           const liveWrongCount = $("liveWrongCount");
           const restartBtn = $("restartBtn");
         
           // --- Stato ---
           let deck=[], index=0, right=0, wrong=0;
           let historyRight=[], historyWrong=[];
           let lock=false;
         
           // --- HUD ---
           function updateHud(){
             counterEl.textContent = `${index} / ${deck.length}`;
             pbEl.style.width = Math.round((index/deck.length)*100) + "%";
             scoreRightEl.textContent = `✔ ${right}`;
             scoreWrongEl.textContent = `✖ ${wrong}`;
             liveRightCount.textContent = right;
             liveWrongCount.textContent = wrong;
          scoreRightEl.style.display = "none";
          scoreWrongEl.style.display = "none";
           }
         
           function updateLiveLists(){
             // Corrette
             listRightEl.innerHTML = "";
             historyRight.forEach(({country,capital})=>{
               const li=document.createElement("li");
               li.textContent = `${country} — ${capital}`;
               listRightEl.appendChild(li);
             });
             // Errate
             listWrongEl.innerHTML = "";
             historyWrong.forEach(({country,capital,picked})=>{
               const li=document.createElement("li");
               li.innerHTML = `${country} — <strong>${capital}</strong> (tu: ${picked})`;
               listWrongEl.appendChild(li);
             });
           }
         
           function setButtonsEnabled(enabled){
             answersRow.querySelectorAll("button.answer-btn").forEach(b=>b.disabled=!enabled);
           }
         
           // --- Gioco ---
           function renderQuestion(){
             if(index>=deck.length){ return showEnd(); }
             const q = deck[index];
         
             // Domanda + bandiera
             questionEl.textContent = `Qual è la capitale di ${q.country}?`;
             flagEl.src = buildFlagUrl(q.code);
             flagEl.alt = `Bandiera di ${q.country}`;
             flagEl.onerror = () => { flagEl.style.display="none"; };
             flagEl.onload  = () => { flagEl.style.display="inline-block"; };
         
             // Opzioni (1 corretta + 3 errate)
             const pool = COUNTRIES.filter(c=>c.capital!==q.capital).map(c=>c.capital);
             const wrongChoices = shuffle(pool).slice(0,3);
             const options = shuffle([q.capital, ...wrongChoices]);
         
             // Render pulsanti
             answersRow.innerHTML = "";
             options.forEach(opt=>{
               const col = document.createElement("div");
               col.className = "col-12 col-md-6";
               const btn = document.createElement("button");
               btn.type = "button";
               btn.className = "btn answer-btn w-100";
               btn.textContent = opt;
               btn.addEventListener("click",()=>onAnswer(btn,opt,q));
               col.appendChild(btn);
               answersRow.appendChild(col);
             });
         
             updateHud();
           }
         
           function onAnswer(btn,picked,q){
             if(lock) return;
             lock=true;
             setButtonsEnabled(false);
         
             // Evidenzia corretta
             answersRow.querySelectorAll("button.answer-btn").forEach(b=>{
               if(b.textContent===q.capital){
                 b.classList.add("correct");
               }
             });
         
             if(picked===q.capital){
               right++; btn.classList.add("correct");
               historyRight.push({country:q.country,capital:q.capital});
             } else {
               wrong++; btn.classList.add("wrong");
               historyWrong.push({country:q.country,capital:q.capital,picked});
             }
         
             updateHud();
             updateLiveLists();
         
             setTimeout(()=>{
               index++;
               lock=false;
               renderQuestion();
               setButtonsEnabled(true);
             }, 850);
           }
         
           function showEnd(){
             questionEl.textContent = "Quiz completato!";
             answersRow.innerHTML = "";
             flagEl.src = "";
             counterEl.textContent = `${deck.length} / ${deck.length}`;
             pbEl.style.width = "100%";
             restartBtn.style.display = "inline-block";
           }
         
           function start(){
             deck = shuffle(COUNTRIES);
             index = 0; right = 0; wrong = 0;
             historyRight = []; historyWrong = [];
             restartBtn.style.display = "none";
             updateHud();
             updateLiveLists();
             renderQuestion();
           }
         
           restartBtn.addEventListener("click", start);
         
           // Avvio sicuro dopo parsing DOM
           if (document.readyState === "loading") {
             document.addEventListener("DOMContentLoaded", start);
           } else {
             start();
           }
         
         })();
      </script>
   </body>
</html>
